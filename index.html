function readTxFilters(){
  txFilters.search = document.getElementById('fSearch').value.trim().toLowerCase();
  txFilters.dateFrom = document.getElementById('fFrom').value;
  txFilters.dateTo = document.getElementById('fTo').value;
  txFilters.type = document.getElementById('fType').value;
  txFilters.category = document.getElementById('fCategory').value;
  txFilters.product = document.getElementById('fProduct').value;
  txFilters.showVoid = document.getElementById('fShowVoid').checked;
}
function txLines(txId){ return STATE.lines.filter(l=>l.transaction_id===txId); }
function filteredTransactions(){
  return STATE.transactions.filter(t=>{
    if(!txFilters.showVoid && t.status==='VOID') return false;
    if(txFilters.dateFrom && t.transaction_date < txFilters.dateFrom) return false;
    if(txFilters.dateTo && t.transaction_date > txFilters.dateTo) return false;
    const lines = txLines(t.transaction_id);
    if(txFilters.type && !lines.some(l=>l.type===txFilters.type)) return false;
    if(txFilters.category && !lines.some(l=>l.category===txFilters.category)) return false;
    if(txFilters.product && !lines.some(l=>l.product_id===txFilters.product)) return false;
    if(txFilters.search){
      const hay = (t.note+' '+(t.customer_name||'')+' '+lines.map(l=>l.product_name+' '+l.description+' '+l.category).join(' ')).toLowerCase();
      if(hay.indexOf(txFilters.search) === -1) return false;
    }
    return true;
  }).sort((a,b)=> (b.transaction_date||'').localeCompare(a.transaction_date||'') || String(b.transaction_id).localeCompare(String(a.transaction_id)));
}
function renderTxRows(){
  const rows = filteredTransactions();
  const tbody = document.getElementById('txTbody');
  if(!rows.length){ tbody.innerHTML = `<tr><td colspan="10"><div class="empty">ไม่พบรายการ</div></td></tr>`; return; }
  tbody.innerHTML = rows.map(t=>{
    const lines = txLines(t.transaction_id);
    const expanded = expandedTx.has(t.transaction_id);
    const isVoid = t.status==='VOID';
    const linesHtml = expanded ? `<tr class="txn-lines"><td></td><td colspan="10">
      <table style="margin:4px 0;"><thead><tr><th>รายการ</th><th>ประเภท</th><th>หมวด</th><th>จำนวน</th><th>ราคา/หน่วย</th><th>ส่วนลด</th><th>รวม</th><th>Stock</th><th></th></tr></thead>
      <tbody>${lines.map(l=>`<tr>
        <td>${escapeHtml(l.product_name||l.description||l.note||'-')}</td>
        <td><span class="tag ${l.type}">${l.type==='income'?'รายรับ':'รายจ่าย'}</span></td>
        <td>${escapeHtml(l.category||'-')}</td>
        <td class="num">${l.quantity}</td><td class="num">${fmtMoney(l.unit_price)}</td><td class="num">${fmtMoney(l.discount||0)}</td><td class="num">${fmtMoney(l.total)}</td>
        <td class="num">${l.product_id ? (Number(l.stock_effect)||0) : 'ไม่ตัด'}</td>
        <td>${(!isVoid && l.type==='income' && l.product_id && !l.is_service_usage && !l.is_return) ? `<button class="btn secondary small" data-return="${t.transaction_id}|${l.line_id}">${icon('return',12)} คืนสินค้า</button><button class="btn secondary small" data-refund="${t.transaction_id}|${l.line_id}">คืนเงิน (ไม่คืนของ)</button>` : ''}</td>
      </tr>`).join('')}</tbody></table>
    </td></tr>` : '';
    const payStatus = t.payment_status || (t.payment_method==='ค้างชำระ'?'ค้างชำระ':'ชำระแล้ว');
    const payTagClass = payStatus==='ชำระแล้ว' ? 'income' : (payStatus==='ค้างชำระ' ? 'expense' : 'warn');
    return `<tr data-txrow="${t.transaction_id}" class="${isVoid?'voided':''}">
      <td><button class="expand-btn" data-toggle="${t.transaction_id}">${expanded?icon('chevronUp',13):icon('chevronDown',13)}</button></td>
      <td class="mono" style="font-size:11px;">${t.transaction_id}</td>
      <td class="num">${t.transaction_date||''}</td>
      <td>${escapeHtml(t.customer_name||'-')}</td>
      <td>${escapeHtml(t.payment_method||'-')}</td>
      <td><span class="tag ${payTagClass}">${payStatus}</span></td>
      <td class="num">${fmtMoney(t.total_income)}</td>
      <td class="num">${fmtMoney(t.total_expense)}</td>
      <td class="num">${fmtMoney(t.gross_profit)}</td>
      <td>${isVoid?'<span class="tag void">VOID</span>':'<span class="tag income">ปกติ</span>'}</td>
      <td><div class="row" style="gap:6px;">
        ${isVoid?'':`<button class="btn secondary small" data-edit="${t.transaction_id}">แก้ไข</button>`}
        ${isVoid?'':`<button class="btn danger small" data-void="${t.transaction_id}">${icon('x',12)} ยกเลิก (VOID)</button>`}
        <button class="btn secondary small" data-hist="${t.transaction_id}">ประวัติ</button>
      </div></td>
    </tr>${linesHtml}`;
  }).join('');
  tbody.querySelectorAll('[data-toggle]').forEach(b=> b.onclick = ()=>{ const id=b.dataset.toggle; expandedTx.has(id)?expandedTx.delete(id):expandedTx.add(id); renderTxRows(); });
  tbody.querySelectorAll('[data-edit]').forEach(b=> b.onclick = ()=> openEditTxModal(b.dataset.edit));
  tbody.querySelectorAll('[data-void]').forEach(b=> b.onclick = ()=> confirmVoidTx(b.dataset.void));
  tbody.querySelectorAll('[data-hist]').forEach(b=> b.onclick = ()=> openTxHistoryModal(b.dataset.hist));
  tbody.querySelectorAll('[data-return]').forEach(b=> b.onclick = ()=>{ const [txId,lineId]=b.dataset.return.split('|'); openReturnModal(txId,lineId); });
  tbody.querySelectorAll('[data-refund]').forEach(b=> b.onclick = ()=>{ const [txId,lineId]=b.dataset.refund.split('|'); openRefundModal(txId,lineId); });

      </div>
      <div id="editLineEditorContainer"></div>
    </div>
    <div class="modal-foot"><button class="btn secondary" id="mCancel">ยกเลิก</button><button class="btn" id="mSave">บันทึกการแก้ไข</button></div>
  `);
  const editor = createLineEditor('editLineEditorContainer', drafts, {});
  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mSave').onclick = async ()=>{
    if(!editor.isAllResolved()){ toast('มีรายการที่ยังไม่ได้แก้ไขให้ครบถ้วน'); return; }
    const newDrafts = editor.getDrafts();
    const overrides = computeHypotheticalStockAfterReversal(txId);
    const issues = checkStockSufficiency(newDrafts, overrides);
    if(issues.length){ const proceed = await confirmInsufficientStock(issues); if(!proceed) return; }
    const lines = newDrafts.map(d=>({
      type:d.type, category:d.category||'', product_id:d.product_id||'', product_name:d.product_name||'',
      description:d.description||'', quantity:d.quantity, unit:d.unit||'', unit_price:d.unit_price||0, discount:d.discount||0,
      total:d.total||0, cost:d.cost!==null&&d.cost!==undefined?d.cost:'', profit:d.profit!==null&&d.profit!==undefined?d.profit:'',
      is_service_usage:!!d.is_service_usage, note:d.raw
    }));
    const txUpdates = { transaction_date: document.getElementById('mDate').value, customer_name: document.getElementById('mCustomer').value, customer_id: document.getElementById('mCustomer').value, payment_method: document.getElementById('mPayment').value };
    try{
      if(isLive()){ await apiPost('updatetransaction', {transaction_id:txId, transaction:txUpdates, lines}); await loadAll(); }
      else { localUpdateTransaction(txId, txUpdates, lines); }
      closeModal(); toast('แก้ไขรายการแล้ว (ย้อน Stock เดิมและตัดใหม่ให้ถูกต้อง)'); renderTxRows();
    }catch(err){ toast('แก้ไขไม่สำเร็จ: '+err.message); }
  };
}
function computeHypotheticalStockAfterReversal(txId){
  const overrides = {};
  txLines(txId).forEach(l=>{
    if(l.product_id && Number(l.stock_effect)){
      const p = STATE.products.find(pp=>pp.product_id===l.product_id);
      if(p){ const base = overrides[l.product_id]!==undefined?overrides[l.product_id]:(Number(p.stock)||0); overrides[l.product_id] = base - Number(l.stock_effect); }
    }
  });
  return overrides;
}

function renderStockRows(){
  const search = (document.getElementById('sSearch').value||'').toLowerCase();

  const lowOnly = document.getElementById('sLowOnly').checked;
  const rows = STATE.products.filter(p=>{
    if(p.active===false) return false;
    if(cat && p.category!==cat) return false;
    if(search && (p.product_name+p.brand+p.model).toLowerCase().indexOf(search)===-1) return false;
    if(lowOnly && !(Number(p.stock) <= Number(p.minimum_stock||0))) return false;
    return true;

  if(!rows.length){ tbody.innerHTML = `<tr><td colspan="10"><div class="empty">ไม่พบสินค้า</div></td></tr>`; return; }

let profitRange = 'today'; let customFrom = todayStr(), customTo = todayStr();
function renderProfit(){
  const el = document.getElementById('view-profit');
  el.innerHTML = `
    <div class="card">
      <div class="row">
        ${[['today','วันนี้'],['7d','7 วัน'],['month','เดือนนี้'],['lastmonth','เดือนที่แล้ว'],['custom','กำหนดเอง']]
          .map(([k,label])=>`<button class="btn ${profitRange===k?'':'secondary'} small" data-range="${k}">${label}</button>`).join('')}
        <div id="customRangeInputs" class="row" style="${profitRange==='custom'?'':'display:none'}">
          <input type="date" id="pFrom" value="${customFrom}" style="width:150px;"><input type="date" id="pTo" value="${customTo}" style="width:150px;">
        </div>
      </div>
    </div>
    <h2 class="section-title">สรุป</h2>
    <div class="grid grid-4" id="profitSummary"></div>
    <h2 class="section-title">กำไรตามสินค้า/บริการ</h2>
    <div class="card" style="padding:0;overflow:auto;">
      <table><thead><tr><th>สินค้า/บริการ</th><th>ยอดขาย</th><th>ต้นทุน</th><th>กำไร</th><th>Margin</th></tr></thead><tbody id="profitByProduct"></tbody></table>
    </div>
  `;
  el.querySelectorAll('[data-range]').forEach(b=>{ b.onclick = ()=>{ profitRange = b.dataset.range; renderProfit(); }; });
  if(profitRange==='custom'){
    document.getElementById('pFrom').onchange = e=>{ customFrom=e.target.value; renderProfitData(); };
    document.getElementById('pTo').onchange = e=>{ customTo=e.target.value; renderProfitData(); };
  }
  renderProfitData();
}
function getProfitDateRange(){
  const today = todayStr();
  if(profitRange==='today') return [today, today];
  if(profitRange==='7d') return [daysAgoStr(6), today];
  if(profitRange==='month') return [today.slice(0,7)+'-01', today];
  if(profitRange==='lastmonth'){
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-1);
    const from = d.toISOString().slice(0,10);
    const lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).toISOString().slice(0,10);
    return [from, lastDay];
  }
  return [customFrom, customTo];
}
function renderProfitData(){
  const [from,to] = getProfitDateRange();
  const txIds = new Set(STATE.transactions.filter(t=>t.status!=='VOID' && t.transaction_date>=from && t.transaction_date<=to).map(t=>t.transaction_id));
  const lines = STATE.lines.filter(l=>txIds.has(l.transaction_id));

  let sales=0, cogsFromSales=0, cogsFromParts=0, opex=0, purchaseAmount=0;
  lines.forEach(l=>{
    const total = Number(l.total)||0;
    if(l.type==='income'){ sales+=total; if(l.cost!==''&&l.cost!=null) cogsFromSales+=Number(l.cost); }
    else if(l.type==='expense'){
      if(l.is_service_usage) cogsFromParts+=total;
      else if(l.product_id) purchaseAmount+=total; // ซื้อเข้าสต็อก — ไม่นับเป็นค่าใช้จ่ายดำเนินงาน (กันนับต้นทุนซ้ำ)
      else opex+=total;
    }
  });
  const cogs = cogsFromSales+cogsFromParts;
  const gross = round2(sales-cogs); const net = round2(gross-opex);

  document.getElementById('profitSummary').innerHTML = `
    ${kpiCard('ยอดขาย', sales, 'income')}
    ${kpiCard('ต้นทุนสินค้าที่ขาย', cogs, 'expense')}
    ${kpiCard('กำไรขั้นต้น', gross, 'profit')}
    ${kpiCard('ค่าใช้จ่ายดำเนินงาน', opex, 'expense')}
  ` + kpiCard('กำไรสุทธิ', net, 'profit');
  if(purchaseAmount>0){
    document.getElementById('profitSummary').insertAdjacentHTML('beforeend', `<div class="card"><div class="label muted">ยอดซื้อสินค้าเข้าสต็อก (ไม่นับเป็นค่าใช้จ่ายในกำไร)</div><div class="value mono">${fmtMoney(purchaseAmount)}</div></div>`);
  }

  const byProduct = {};
  lines.filter(l=>l.type==='income' && l.product_name).forEach(l=>{
    const key = l.product_name;
    if(!byProduct[key]) byProduct[key] = {sales:0, cost:0, hasCost:true};
    byProduct[key].sales += Number(l.total)||0;
    if(l.cost!==''&&l.cost!=null){ byProduct[key].cost += Number(l.cost); } else { byProduct[key].hasCost = false; }
  });
  const tbody = document.getElementById('profitByProduct');
  const entries = Object.entries(byProduct).sort((a,b)=>b[1].sales-a[1].sales);
  if(!entries.length){ tbody.innerHTML = `<tr><td colspan="5"><div class="empty">ไม่มีข้อมูลในช่วงนี้</div></td></tr>`; return; }
  tbody.innerHTML = entries.map(([name,d])=>{
    const profit = d.sales-d.cost; const margin = d.sales?(profit/d.sales*100):0;
    return `<tr><td>${escapeHtml(name)}</td><td class="num">${fmtMoney(d.sales)}</td>
      <td class="num">${d.hasCost?fmtMoney(d.cost):'<span class="cost-missing">ไม่ทราบ</span>'}</td>
      <td class="num">${d.hasCost?fmtMoney(profit):'-'}</td><td class="num">${d.hasCost?margin.toFixed(2)+'%':'-'}</td></tr>`;
  }).join('');
}

const ADJUST_TYPES = [
  {value:'ADJUSTMENT', label:'ตรวจนับ / ปรับยอด', reasons:['ตรวจนับสินค้าจริง','Stock ไม่ตรง'], bidirectional:true},
  {value:'DAMAGE', label:'ของเสีย / ชำรุด', reasons:['สินค้าชำรุด','ของเสียหาย'], bidirectional:false},
  {value:'GIFT', label:'ของแถม', reasons:['แถมให้ลูกค้า','ของแถมโปรโมชัน'], bidirectional:false},
  {value:'INTERNAL_USE', label:'ใช้งานภายในร้าน', reasons:['นำไปใช้ในร้าน','ใช้ทดสอบเครื่อง'], bidirectional:false}
];
function renderAdjust(targetId){
  const el = document.getElementById(targetId || 'view-adjust');
  el.innerHTML = `
    <div class="card">
      <div class="grid grid-2">
        <div><label class="field-label">สินค้า</label>

        </div>
        <div><label class="field-label">ประเภทการปรับ</label>
          <select id="adjType">${ADJUST_TYPES.map(t=>`<option value="${t.value}">${t.label}</option>`).join('')}</select>
        </div>
      </div>
      <div class="grid grid-2" style="margin-top:10px;" id="adjModeRow">
        <div><label class="field-label">วิธีปรับ</label>
          <select id="adjMode"><option value="delta">ระบุจำนวนที่ปรับ (+/-)</option><option value="actual">ระบุยอดนับจริง</option></select>
        </div>
        <div></div>
      </div>
      <div class="grid grid-2" style="margin-top:10px;">
        <div><label class="field-label" id="adjQtyLabel">จำนวนที่ปรับ (ใส่ - หากลด)</label><input type="number" id="adjQty" value="0"></div>
        <div><label class="field-label">คงเหลือหลังปรับ</label><div class="mono" id="adjPreview" style="padding:9px 0;font-size:15px;">-</div></div>
      </div>
      <div style="margin-top:10px;">
        <label class="field-label">เหตุผล (จำเป็น)</label>
        <input type="text" id="adjReason" placeholder="เช่น ตรวจนับสินค้าจริง">
        <div class="examples" id="adjReasonChips" style="margin-top:6px;"></div>
      </div>
      <div style="margin-top:12px;"><button class="btn" id="btnSubmitAdjust">บันทึกการปรับ Stock</button></div>
    </div>
    <h2 class="section-title">ประวัติการปรับ Stock ล่าสุด</h2>
    <div class="card" style="padding:0;overflow:auto;">
      <table><thead><tr><th>วันที่</th><th>ประเภท</th><th>สินค้า</th><th>จำนวน</th><th>เหตุผล</th></tr></thead><tbody id="adjHistTbody"></tbody></table>
    </div>
  `;
  const productSel = document.getElementById('adjProduct');
  const typeSel = document.getElementById('adjType');
  const modeSel = document.getElementById('adjMode');
  const modeRow = document.getElementById('adjModeRow');
  const qtyInput = document.getElementById('adjQty');
  const preview = document.getElementById('adjPreview');
  const qtyLabel = document.getElementById('adjQtyLabel');
  const reasonChips = document.getElementById('adjReasonChips');

  function currentTypeInfo(){ return ADJUST_TYPES.find(t=>t.value===typeSel.value); }
  function renderReasonChips(){
    reasonChips.innerHTML = currentTypeInfo().reasons.map(r=>`<button class="example-chip" data-reason="${r}">${r}</button>`).join('');
    reasonChips.querySelectorAll('[data-reason]').forEach(b=> b.onclick = ()=>{ document.getElementById('adjReason').value = b.dataset.reason; });
  }
  function updatePreview(){
    const p = STATE.products.find(pp=>pp.product_id===productSel.value);
    const info = currentTypeInfo();
    const v = parseFloat(qtyInput.value)||0;
    let result;
    if(!info.bidirectional){ result = (Number(p.stock)||0) - Math.abs(v); }
    else { result = modeSel.value==='actual' ? v : (Number(p.stock)||0)+v; }
    preview.textContent = result + ' ' + p.unit;
  }
  typeSel.onchange = ()=>{
    const info = currentTypeInfo();
    modeRow.style.display = info.bidirectional ? 'grid' : 'none';
    qtyLabel.textContent = info.bidirectional ? (modeSel.value==='actual'?'ยอดนับจริง':'จำนวนที่ปรับ (ใส่ - หากลด)') : 'จำนวนที่ลด';
    renderReasonChips(); document.getElementById('adjReason').value=''; updatePreview();
  };
  modeSel.onchange = ()=>{ qtyLabel.textContent = modeSel.value==='actual' ? 'ยอดนับจริง' : 'จำนวนที่ปรับ (ใส่ - หากลด)'; updatePreview(); };
  productSel.onchange = updatePreview; qtyInput.oninput = updatePreview;
  renderReasonChips(); updatePreview();

  document.getElementById('btnSubmitAdjust').onclick = async ()=>{
    const reason = document.getElementById('adjReason').value.trim();
    if(!reason){ toast('กรุณาระบุเหตุผลในการปรับ Stock'); return; }
    const p = STATE.products.find(pp=>pp.product_id===productSel.value);
    const info = currentTypeInfo();
    const v = parseFloat(qtyInput.value)||0;
    let delta;
    if(!info.bidirectional){ delta = -Math.abs(v); if(v===0){ toast('กรุณาระบุจำนวน'); return; } }
    else { delta = modeSel.value==='actual' ? (v - (Number(p.stock)||0)) : v; }
    if(delta===0){ toast('ไม่มีการเปลี่ยนแปลง Stock'); return; }
    try{
      if(isLive()){ await apiPost('adjuststock', {product_id:p.product_id, delta, reason, movement_type: info.value}); await loadAll(); }
      else { localApplyStockDelta(p.product_id, delta, '', '', info.bidirectional ? (delta>=0?'ADJUSTMENT_INCREASE':'ADJUSTMENT_DECREASE') : info.value, reason); }
      toast('บันทึกการปรับ Stock แล้ว'); renderAdjust(targetId);
    }catch(err){ showFriendlyError('ปรับ Stock', err); }
  };

  const ADJ_TYPES_SHOW = ['ADJUSTMENT_INCREASE','ADJUSTMENT_DECREASE','DAMAGE','GIFT','INTERNAL_USE'];
  const hist = STATE.stockMovements.filter(m=>ADJ_TYPES_SHOW.indexOf(m.type)>-1).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,30);
  document.getElementById('adjHistTbody').innerHTML = hist.length ? hist.map(m=>{
    const sign = ['SALE','PURCHASE_REVERSAL','SERVICE_USAGE','DAMAGE','GIFT','INTERNAL_USE','ADJUSTMENT_DECREASE'].indexOf(m.type)>-1 ? '-' : '+';
    return `<tr><td class="num">${m.date}</td><td>${m.type}</td><td>${escapeHtml(m.product_name)}</td><td class="num">${sign}${m.quantity}</td><td>${escapeHtml(m.reason||m.note||'')}</td></tr>`;
  }).join('') : `<tr><td colspan="5"><div class="empty">ยังไม่มีประวัติการปรับ Stock</div></td></tr>`;
}

function localCustomerHistory(name){
  const needle = name.trim().toLowerCase();
  const txs = STATE.transactions.filter(t=> t.status!=='VOID' && String(t.customer_name||'').toLowerCase().indexOf(needle)>-1)
    .sort((a,b)=> String(b.transaction_date).localeCompare(String(a.transaction_date)));
  let totalPurchase=0, totalOutstanding=0;
  txs.forEach(t=>{
    totalPurchase += Number(t.total_income)||0;
    const paid = t.amount_paid!==''&&t.amount_paid!=null ? Number(t.amount_paid) : (t.payment_method==='ค้างชำระ'?0:Number(t.total_income)||0);
    totalOutstanding += Math.max(0, (Number(t.total_income)||0) - paid);
  });
  const detailed = txs.map(t=> Object.assign({}, t, {lines: STATE.lines.filter(l=>l.transaction_id===t.transaction_id)}));
  return { name, transactions: detailed, totalPurchase: round2(totalPurchase), totalOutstanding: round2(totalOutstanding) };
}
function renderCustomerResult(result){
  const el = document.getElementById('custResult');
  if(!result.transactions.length){ el.innerHTML = `<div class="empty">ไม่พบประวัติของ "${escapeHtml(result.name)}"</div>`; return; }
  el.innerHTML = `
    <div class="grid grid-4">
      <div class="card kpi income"><div class="label">ยอดซื้อสะสม</div><div class="value">${fmtMoney(result.totalPurchase)}</div></div>
      <div class="card kpi expense"><div class="label">ยอดค้างชำระ</div><div class="value">${fmtMoney(result.totalOutstanding)}</div></div>
      <div class="card kpi"><div class="label">จำนวนบิล</div><div class="value">${result.transactions.length}</div></div>
    </div>
    <div class="card" style="margin-top:14px;padding:0;overflow:auto;">
      <table><thead><tr><th>เลขที่</th><th>วันที่</th><th>รายการ</th><th>ยอดรวม</th><th>ชำระ</th></tr></thead>
      <tbody>${result.transactions.map(t=>`<tr>
        <td class="mono" style="font-size:11px;">${t.transaction_id}</td><td class="num">${t.transaction_date}</td>
        <td>${(t.lines||[]).map(l=>escapeHtml(l.product_name||l.description||l.category)).join(', ')}</td>
        <td class="num">${fmtMoney(t.total_income)}</td><td>${escapeHtml(t.payment_method||'-')}</td>
      </tr>`).join('')}</tbody></table>
    </div>
  `;
}

/* ========================================================================= SETTINGS ========================================================================= */
let settingsTab = 'general';
const SETTINGS_TABS = [
  {id:'general', label:'ทั่วไป'},
  {id:'keywords', label:'Keyword'},
  {id:'parser', label:'Parser / AI'},
  {id:'system', label:'ระบบ'},
  {id:'data', label:'ข้อมูล'}
];
function renderSettings(){
  const el = document.getElementById('view-settings');
  el.innerHTML = `
    <div class="tabs">${SETTINGS_TABS.map(t=>`<button class="${settingsTab===t.id?'active':''}" data-settingstab="${t.id}">${t.label}</button>`).join('')}</div>
    <div id="settingsTabContent"></div>
  `;
  el.querySelectorAll('[data-settingstab]').forEach(b=> b.onclick = ()=>{ settingsTab = b.dataset.settingstab; renderSettings(); });
  if(settingsTab==='general') renderSettingsGeneral('settingsTabContent');
  else if(settingsTab==='keywords') renderKeywords('settingsTabContent');
  else if(settingsTab==='parser') renderSettingsParser('settingsTabContent');
  else if(settingsTab==='system') renderSettingsSystem('settingsTabContent');
  else renderSettingsData('settingsTabContent');
}

function renderReconcileResult(mismatches){
  const box = document.getElementById('settingsToolResult');
  if(!mismatches.length){ box.innerHTML = `<div class="empty" style="color:var(--color-success);">${icon('check',16)} Stock ทุกรายการตรงกับ Stock_Movements</div>`; return; }
  box.innerHTML = `<table><thead><tr><th>สินค้า</th><th>ค่าที่บันทึกไว้</th><th>ค่าที่คำนวณได้จริง</th><th></th></tr></thead><tbody>
    ${mismatches.map(m=>`<tr><td>${escapeHtml(m.product_name)}</td><td class="num">${m.stored}</td><td class="num">${m.computed}</td>
      <td>${isLive()?`<button class="btn secondary small" data-repair="${m.product_id}" data-before="${m.stored}" data-after="${m.computed}">ซ่อม Stock</button>`:''}</td></tr>`).join('')}
  </tbody></table>`;
  box.querySelectorAll('[data-repair]').forEach(b=>{
    b.onclick = ()=> confirmRepairStock(b.dataset.repair, b.dataset.before, b.dataset.after);
  });
}
function confirmRepairStock(productId, before, after){
  openModal(`
    <div class="modal-head"><h3>ยืนยันการซ่อม Stock</h3><button class="close-x" id="mClose">${icon('x')}</button></div>
    <div class="modal-body">
      <p>Stock ปัจจุบัน: <strong>${before}</strong> → จะแก้เป็น: <strong>${after}</strong> (คำนวณจาก Stock_Movements ทั้งหมด)</p>
      <p class="muted" style="font-size:12px;">การซ่อมจะสร้างรายการปรับ Stock พร้อมเหตุผลอัตโนมัติ และบันทึกลง Audit Trail — ไม่แก้ข้อมูลแบบเงียบๆ</p>
    </div>
    <div class="modal-foot"><button class="btn secondary" id="mCancel">ยกเลิก</button><button class="btn" id="mConfirm">ยืนยันการแก้ไข</button></div>
  `);
  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mConfirm').onclick = async ()=>{
    try{
      await apiPost('repairstock', {product_id:productId});
      await loadAll();
      closeModal(); toast('ซ่อม Stock แล้ว');
      const mismatches = await apiGet('reconcilestock');
      renderReconcileResult(mismatches);
    }catch(err){ showFriendlyError('ซ่อม Stock', err); }
  };
}
function renderIntegrityResult(result){
  const box = document.getElementById('settingsToolResult');
  const total = (result.referenceIssues||[]).length + (result.stockMismatches||[]).length;
  if(!total){ box.innerHTML = `<div class="empty" style="color:var(--color-success);">${icon('check',16)} ไม่พบปัญหาข้อมูล</div>`; return; }
  box.innerHTML = `
    ${result.referenceIssues.length ? `<h2 class="section-title" style="margin-top:0;">ข้อมูลอ้างอิงที่ผิดปกติ</h2>
      <table><thead><tr><th>ประเภท</th><th>Transaction</th><th>รายละเอียด</th></tr></thead><tbody>
      ${result.referenceIssues.map(i=>`<tr><td>${i.type}</td><td class="mono" style="font-size:11px;">${i.transaction_id}</td><td>${escapeHtml(i.detail)}</td></tr>`).join('')}
      </tbody></table>` : ''}
    ${result.stockMismatches.length ? `<h2 class="section-title">Stock ไม่ตรงกับ Stock Movements</h2>` : ''}
  `;
  if(result.stockMismatches.length) renderReconcileResult(result.stockMismatches);
}
function localReconcileAll(){
  return STATE.products.map(p=>{
    const moves = STATE.stockMovements.filter(m=>m.product_id===p.product_id);
    const NEGATIVE_TYPES = ['SALE','PURCHASE_REVERSAL','SERVICE_USAGE','DAMAGE','GIFT','INTERNAL_USE','ADJUSTMENT_DECREASE'];
    const computed = round2(moves.reduce((sum,m)=>{
      const qty = Number(m.quantity)||0;
      const isNegative = NEGATIVE_TYPES.indexOf(m.type)>-1;
      return sum + (isNegative?-qty:qty);
    },0));
    const stored = Number(p.stock)||0;
    return { product_id:p.product_id, product_name:p.product_name, stored, computed, ok: Math.abs(stored-computed)<0.01 };
  }).filter(r=>!r.ok);
}

function mountViews(){
  const content = document.getElementById('content');
  content.innerHTML = VIEWS.map(v=>`<section class="view" id="view-${v.id}"></section>`).join('');
  document.getElementById('view-dashboard').classList.add('active');
}
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });

async function boot(){
  mountViews(); renderNav();
  document.getElementById('pageMeta').textContent = PAGE_META.dashboard;
  document.getElementById('modeBadge').textContent = isLive() ? 'เชื่อมต่อ Sheets' : 'โหมดสาธิต';
  document.getElementById('modeBadge').className = 'badge ' + (isLive() ? 'live' : 'demo');
  document.getElementById('sidebarFoot').textContent = isLive() ? 'เชื่อมต่อ Google Sheets แล้ว' : 'โหมดสาธิต — ยังไม่ได้ต่อ Google Sheets';
  document.getElementById('headerSearchIcon').innerHTML = icon('search',15);
  document.getElementById('headerDate').textContent = formatThaiDate(new Date());
  wireGlobalSearch();
  await loadAll();
  renderDashboard();
}
function formatThaiDate(d){
  const days = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
  const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return `วัน${days[d.getDay()]}ที่ ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()+543}`;
}
function wireGlobalSearch(){
  const input = document.getElementById('globalSearch');
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter'){
      const q = input.value.trim();
      if(!q) return;
      switchView('transactions');
      const el = document.getElementById('fSearch');
      if(el){ el.value = q; readTxFilters(); renderTxRows(); }
      input.blur();
    }
  });
}
boot();
