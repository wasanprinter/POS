<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>วสันต์ปริ้นเตอร์ — ระบบบริหารร้าน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   DESIGN TOKENS — วสันต์ปริ้นเตอร์ (Wasan Printer)
   ========================================================================= */
:root{
  /* --- Color: Brand --- */
  --color-primary:#1E4FD8;
  --color-primary-hover:#1A3FB0;
  --color-primary-soft:#EAF0FD;
  --color-success:#15803D;
  --color-success-soft:#EAF6EE;
  --color-warning:#B45309;
  --color-warning-soft:#FDF3E7;
  --color-danger:#B91C1C;
  --color-danger-soft:#FBEAEA;
  --color-info:#0369A1;
  --color-info-soft:#E9F4FA;

  /* --- Color: Surface / Text --- */
  --bg-page:#F6F6F3;
  --bg-surface:#FFFFFF;
  --bg-surface-elevated:#FFFFFF;
  --bg-surface-sunken:#F0F0EC;
  --border-default:#E3E1D9;
  --border-strong:#C9C6BA;
  --text-primary:#181816;
  --text-secondary:#54524A;
  --text-muted:#8C8A7F;
  --text-on-primary:#FFFFFF;

  /* --- Typography --- */
  --font-body:'Noto Sans Thai', system-ui, -apple-system, sans-serif;
  --fs-display:28px;      --lh-display:36px;
  --fs-heading:20px;      --lh-heading:28px;
  --fs-section:13px;      --lh-section:20px;
  --fs-body:14px;         --lh-body:22px;
  --fs-label:12px;        --lh-label:16px;
  --fs-caption:11px;      --lh-caption:15px;
  --fs-table:13px;        --lh-table:19px;
  --fs-number-lg:26px;    --lh-number-lg:32px;
  --fs-number-md:18px;    --lh-number-md:24px;

  /* --- Spacing scale --- */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px;
  --sp-6:24px; --sp-7:32px; --sp-8:40px; --sp-9:48px; --sp-10:64px;

  /* --- Radius --- */
  --radius-sm:4px; --radius-md:6px; --radius-lg:10px;

  /* --- Shadow (used sparingly) --- */
  --shadow-none:none;
  --shadow-subtle:0 1px 2px rgba(20,20,15,.06);
  --shadow-elevated:0 6px 20px rgba(20,20,15,.10);
  --shadow-modal:0 16px 40px rgba(20,20,15,.20);

  /* --- Layout --- */
  --sidebar-w:236px;
  --header-h:60px;
  --bottom-nav-h:58px;

  /* --- Z-index system (never hardcode 999/9999 anywhere) --- */
  --z-page:0; --z-header:10; --z-sidebar:20; --z-sticky:30; --z-dropdown:40;
  --z-popover:50; --z-drawer:60; --z-modal:70; --z-confirm:80; --z-toast:90; --z-critical:100;
}

/* =========================================================================
   RESET / BASE
   ========================================================================= */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg-page); color:var(--text-primary);
  font-family:var(--font-body); font-size:var(--fs-body); line-height:var(--lh-body);
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
a{color:inherit;}
.num, .money{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }
.money{ font-weight:600; letter-spacing:-.1px; }

/* =========================================================================
   ICONS
   ========================================================================= */
.icon{ display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; line-height:0; }
.icon svg{ display:block; width:1em; height:1em; }

/* =========================================================================
   APP SHELL
   ========================================================================= */
#app{ display:flex; min-height:100vh; }

.sidebar{
  width:var(--sidebar-w); background:var(--text-primary); color:#E9E8E3;
  display:flex; flex-direction:column; flex-shrink:0;
  position:sticky; top:0; height:100vh; z-index:var(--z-sidebar);
}
.brand{ padding:var(--sp-5) var(--sp-5) var(--sp-4); display:flex; align-items:center; gap:var(--sp-3); }
.brand-mark{
  width:36px; height:36px; border-radius:var(--radius-md); background:var(--color-primary);
  color:#fff; display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:14px; letter-spacing:.2px; flex-shrink:0;
}
.brand-text{ min-width:0; }
.brand-th{ font-weight:700; font-size:14.5px; color:#fff; white-space:nowrap; }
.brand-en{ font-size:10.5px; color:#9A988F; margin-top:1px; letter-spacing:.3px; }

.nav{ flex:1; padding:var(--sp-2) var(--sp-3); display:flex; flex-direction:column; gap:2px; overflow-y:auto; }
.nav button{
  display:flex; align-items:center; gap:var(--sp-3);
  background:transparent; border:none; color:#B9B7AD;
  padding:9px var(--sp-3); border-radius:var(--radius-md);
  text-align:right; justify-content:flex-start; font-size:13.5px; font-weight:500;
  transition:background .12s ease, color .12s ease;
}
.nav button .icon{ font-size:17px; opacity:.85; }
.nav button:hover{ background:rgba(255,255,255,.07); color:#fff; }
.nav button.active{ background:var(--color-primary); color:#fff; }
.nav button.active .icon{ opacity:1; }

.sidebar-foot{ padding:var(--sp-4) var(--sp-5) var(--sp-5); border-top:1px solid rgba(255,255,255,.08); }
.sidebar-foot-text{ font-size:11px; color:#8B8980; margin-top:6px; line-height:1.5; }

.main{ flex:1; min-width:0; display:flex; flex-direction:column; }

.app-header{
  height:var(--header-h); display:flex; align-items:center; justify-content:space-between;
  gap:var(--sp-4); padding:0 var(--sp-6); background:var(--bg-surface);
  border-bottom:1px solid var(--border-default); position:sticky; top:0; z-index:var(--z-header);
}
.header-left{ display:flex; align-items:center; gap:var(--sp-3); min-width:0; }
.header-left h1{ font-size:16.5px; font-weight:700; margin:0; line-height:1.3; }
.header-meta{ font-size:var(--fs-caption); color:var(--text-muted); margin-top:1px; }
.header-right{ display:flex; align-items:center; gap:var(--sp-3); }
.header-search{
  display:flex; align-items:center; gap:var(--sp-2); background:var(--bg-surface-sunken);
  border:1px solid transparent; border-radius:var(--radius-md); padding:0 var(--sp-3);
  height:36px; width:240px; transition:border-color .12s ease, background .12s ease;
}
.header-search:focus-within{ background:var(--bg-surface); border-color:var(--color-primary); }
.header-search .icon{ color:var(--text-muted); font-size:15px; }
.header-search input{ border:none; background:transparent; outline:none; width:100%; font-size:13.5px; }
.header-date{ font-size:12.5px; color:var(--text-secondary); white-space:nowrap; }
.icon-btn{
  width:36px; height:36px; display:none; align-items:center; justify-content:center;
  background:transparent; border:1px solid var(--border-default); border-radius:var(--radius-md); color:var(--text-secondary);
}
.icon-btn .icon{ font-size:18px; }

.content{ padding:var(--sp-6); flex:1; max-width:1280px; width:100%; }
.view{ display:none; }
.view.active{ display:block; }

/* =========================================================================
   TYPOGRAPHY UTILITIES
   ========================================================================= */
h2.section-title{
  font-size:var(--fs-section); font-weight:700; text-transform:uppercase; letter-spacing:.4px;
  color:var(--text-muted); margin:var(--sp-7) 0 var(--sp-3);
}
h2.section-title:first-child{ margin-top:0; }
.muted{ color:var(--text-muted); }
.text-secondary{ color:var(--text-secondary); }

/* =========================================================================
   LAYOUT UTILITIES
   ========================================================================= */
.grid{ display:grid; gap:var(--sp-4); }
.grid-4{ grid-template-columns:repeat(4,1fr); }
.grid-2{ grid-template-columns:repeat(2,1fr); }
.row{ display:flex; gap:var(--sp-3); flex-wrap:wrap; align-items:center; }
.spacer{ flex:1; }
.stack{ display:flex; flex-direction:column; gap:var(--sp-2); }
.divider{ height:1px; background:var(--border-default); margin:var(--sp-4) 0; }
.checkline{ display:flex; align-items:center; gap:var(--sp-2); font-size:var(--fs-body); }

@media (max-width:1023px){ .grid-4{ grid-template-columns:repeat(2,1fr); } }
@media (max-width:640px){ .grid-4{ grid-template-columns:1fr; } .grid-2{ grid-template-columns:1fr; } }

/* =========================================================================
   SURFACE / CARD (used sparingly — not everything is a boxed card)
   ========================================================================= */
.card{
  background:var(--bg-surface); border:1px solid var(--border-default);
  border-radius:var(--radius-lg); padding:var(--sp-5);
}

/* Stat row for dashboard KPIs — understated, not heavy boxed cards */
.stat{ padding:var(--sp-4) 0; }
.stat + .stat{ border-top:1px solid var(--border-default); }
.stat-row{ display:flex; }
.stat-row .stat{ flex:1; padding:0 var(--sp-5) 0 0; border-top:none; }
.stat-row .stat + .stat{ padding-right:0; padding-left:var(--sp-5); border-top:none; border-right:1px solid var(--border-default); margin-right:var(--sp-5); }
.stat-row .stat:last-child{ border-right:none; margin-right:0; padding-left:var(--sp-5); }
.stat .stat-label{ font-size:var(--fs-label); color:var(--text-muted); display:flex; align-items:center; gap:6px; }
.stat .stat-value{ font-size:var(--fs-number-lg); font-weight:700; margin-top:6px; font-variant-numeric:tabular-nums; }
.stat .stat-value.neg{ color:var(--color-danger); }
.stat .stat-sub{ font-size:var(--fs-caption); color:var(--text-muted); margin-top:3px; }
@media (max-width:1023px){
  .stat-row{ flex-wrap:wrap; gap:var(--sp-4); }
  .stat-row .stat{ flex:1 1 45%; border-right:none!important; margin-right:0!important; padding:var(--sp-3) 0!important; border-top:1px solid var(--border-default); }
}

.kpi{ position:relative; overflow:hidden; padding-right:var(--sp-4); }
.kpi::before{ content:''; position:absolute; right:0; top:0; bottom:0; width:3px; }
.kpi.income::before{ background:var(--color-primary); }
.kpi.expense::before{ background:var(--color-danger); }
.kpi.profit::before{ background:var(--color-success); }
.kpi .label{ font-size:var(--fs-label); color:var(--text-muted); }
.kpi .value{ font-size:var(--fs-number-md); font-weight:700; margin-top:6px; font-variant-numeric:tabular-nums; }
.kpi .value.neg{ color:var(--color-danger); }

/* =========================================================================
   BUTTONS
   ========================================================================= */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:9px 16px; border-radius:var(--radius-md); border:1px solid var(--color-primary);
  background:var(--color-primary); color:#fff; font-weight:600; font-size:13.5px;
  transition:background .12s ease, border-color .12s ease, opacity .12s ease;
}
.btn:hover{ background:var(--color-primary-hover); border-color:var(--color-primary-hover); }
.btn:focus-visible{ outline:2px solid var(--color-primary); outline-offset:2px; }
.btn:active{ opacity:.85; }
.btn.secondary{ background:var(--bg-surface); color:var(--text-primary); border:1px solid var(--border-strong); }
.btn.secondary:hover{ background:var(--bg-surface-sunken); border-color:var(--text-muted); }
.btn.danger{ background:var(--color-danger); border-color:var(--color-danger); }
.btn.danger:hover{ background:#9B1717; border-color:#9B1717; }
.btn.small{ padding:6px 11px; font-size:12px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn .icon{ font-size:1.05em; }

/* =========================================================================
   FORM CONTROLS
   ========================================================================= */
input[type=text], input[type=number], input[type=date], input[type=search], select, textarea{
  border:1px solid var(--border-strong); border-radius:var(--radius-md);
  padding:9px 11px; background:var(--bg-surface); width:100%; transition:border-color .12s ease, box-shadow .12s ease;
}
input:focus, select:focus, textarea:focus{
  outline:none; border-color:var(--color-primary); box-shadow:0 0 0 3px var(--color-primary-soft);
}
button:focus-visible{ outline:2px solid var(--color-primary); outline-offset:2px; }
label.field-label{ display:block; font-size:var(--fs-label); color:var(--text-secondary); font-weight:600; margin-bottom:5px; }

/* =========================================================================
   TABLE
   ========================================================================= */
table{ width:100%; border-collapse:collapse; font-size:var(--fs-table); }
th{
  text-align:right; font-weight:700; color:var(--text-muted); font-size:var(--fs-caption);
  text-transform:uppercase; letter-spacing:.3px;
  padding:10px 10px; border-bottom:1px solid var(--border-default); white-space:nowrap;
  position:sticky; top:0; background:var(--bg-surface); z-index:1;
}
td{ padding:10px; border-bottom:1px solid var(--border-default); vertical-align:middle; }
tr:hover td{ background:var(--bg-surface-sunken); }
.num{ text-align:left; }

/* =========================================================================
   BADGES / STATUS
   ========================================================================= */
.tag, .badge{
  display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600;
  padding:3px 8px; border-radius:999px; border:1px solid var(--border-default);
  background:var(--bg-surface-sunken); color:var(--text-secondary); white-space:nowrap;
}
.tag.income{ color:var(--color-primary); background:var(--color-primary-soft); border-color:#C9D8F7; }
.tag.expense{ color:var(--color-danger); background:var(--color-danger-soft); border-color:#F2C9C9; }
.tag.warn{ color:var(--color-warning); background:var(--color-warning-soft); border-color:#F0DBB8; }
.tag.void{ color:var(--text-muted); background:var(--bg-surface-sunken); text-decoration:line-through; }
.tag.ai{ color:#6D28D9; background:#F1ECFC; border-color:#DDD0F5; }
.badge.live{ color:var(--color-success); background:var(--color-success-soft); border-color:#C3E6CE; }
.badge.demo{ color:var(--color-warning); background:var(--color-warning-soft); border-color:#F0DBB8; }

/* Status indicator with icon+text — never color alone */
.status-ind{ display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600; }
.status-ind.ok{ color:var(--color-success); }
.status-ind.warn{ color:var(--color-warning); }
.status-ind.bad{ color:var(--color-danger); }

/* =========================================================================
   TABS
   ========================================================================= */
.tabs{ display:flex; gap:2px; border-bottom:1px solid var(--border-default); margin-bottom:var(--sp-5); }
.tabs button{
  background:none; border:none; padding:10px var(--sp-2); margin-bottom:-1px;
  font-size:13.5px; font-weight:600; color:var(--text-muted); border-bottom:2px solid transparent;
}
.tabs button.active{ color:var(--color-primary); border-bottom-color:var(--color-primary); }
.tabs button:hover:not(.active){ color:var(--text-primary); }

/* =========================================================================
   FILTERS
   ========================================================================= */
.filters{ display:flex; flex-wrap:wrap; gap:var(--sp-3); margin-bottom:var(--sp-4); align-items:flex-end; }
.filters .fgroup{ min-width:130px; }
.filters .fgroup.grow{ flex:1; min-width:180px; }

/* =========================================================================
   CHARTS
   ========================================================================= */
.chart-card{ padding:var(--sp-5) var(--sp-5) var(--sp-3); }
.chart-title{ font-size:13px; font-weight:700; color:var(--text-primary); margin-bottom:var(--sp-3); }
svg.chart{ width:100%; height:auto; display:block; }
.legend{ display:flex; gap:var(--sp-4); font-size:var(--fs-caption); color:var(--text-muted); margin-top:var(--sp-2); }
.legend span{ display:inline-flex; align-items:center; gap:5px; }
.legend i{ width:8px; height:8px; border-radius:2px; display:inline-block; }

/* =========================================================================
   TRANSACTION ENTRY / LINE EDITOR
   ========================================================================= */
.parse-box textarea{ min-height:76px; resize:vertical; font-size:14.5px; }
.parse-actions{ display:flex; gap:var(--sp-3); margin-top:var(--sp-3); }
.examples{ margin-top:var(--sp-3); display:flex; flex-wrap:wrap; gap:6px; }
.example-chip{
  font-size:11.5px; padding:5px 10px; border-radius:999px; border:1px dashed var(--border-strong);
  background:var(--bg-surface); color:var(--text-muted); text-align:right; max-width:100%;
}
.example-chip:hover{ border-color:var(--color-primary); color:var(--color-primary); border-style:solid; }

.lines-wrap{ margin-top:var(--sp-5); border:1px solid var(--border-default); border-radius:var(--radius-lg); overflow:hidden; background:var(--bg-surface); }
.lines-table-wrap{ overflow-x:auto; }
.line-issue{ background:var(--color-warning-soft); }
.line-resolve{ padding:var(--sp-3) var(--sp-4); display:flex; flex-direction:column; gap:var(--sp-2); }
.line-resolve .msg{ font-size:12.5px; color:var(--color-warning); font-weight:600; display:flex; align-items:center; gap:6px; }
.notice{ border-radius:var(--radius-md); padding:10px 12px; font-size:12.5px; }
.notice.warn{ background:var(--color-warning-soft); border:1px solid #F0DBB8; color:#7A5600; }
.notice.danger{ background:var(--color-danger-soft); border:1px solid #F2C9C9; color:var(--color-danger); }
.candidates{ display:flex; flex-wrap:wrap; gap:var(--sp-2); }
.candidate-btn{ padding:7px 11px; border:1px solid var(--border-strong); border-radius:var(--radius-md); background:var(--bg-surface); font-size:12.5px; text-align:right; }
.candidate-btn:hover{ border-color:var(--color-primary); }
.candidate-btn .pn{ font-weight:700; display:block; }
.candidate-btn .pm{ font-size:10.5px; color:var(--text-muted); }
.mini-input{ width:82px; padding:6px 7px; font-size:12.5px; }
.summary-bar{ display:flex; flex-wrap:wrap; gap:var(--sp-6); padding:var(--sp-4) var(--sp-5); border-top:1px solid var(--border-default); background:var(--bg-surface-sunken); }
.summary-bar .item{ font-size:var(--fs-label); color:var(--text-muted); }
.summary-bar .item b{ display:block; font-size:16px; color:var(--text-primary); margin-top:3px; font-variant-numeric:tabular-nums; }
.lines-actions{ padding:var(--sp-4) var(--sp-5); display:flex; gap:var(--sp-3); flex-wrap:wrap; border-top:1px solid var(--border-default); }
.del-line{ background:none; border:none; color:var(--text-muted); font-size:15px; padding:4px; border-radius:var(--radius-sm); }
.del-line:hover{ color:var(--color-danger); background:var(--color-danger-soft); }
.cost-missing{ color:var(--color-warning); font-size:11px; }
.low-stock-item{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border-default); font-size:13.5px; }
.low-stock-item:last-child{ border-bottom:none; }

.confidence-bar{ display:inline-block; width:44px; height:5px; border-radius:3px; background:var(--bg-surface-sunken); overflow:hidden; vertical-align:middle; margin-left:6px; }
.confidence-bar i{ display:block; height:100%; }
.confidence-label{ font-size:10.5px; color:var(--text-muted); margin-right:2px; }

/* Recent transaction list rows are clickable */
.recent-row{ display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--border-default); cursor:pointer; }
.recent-row:last-child{ border-bottom:none; }
.recent-row:hover{ background:var(--bg-surface-sunken); margin:0 calc(var(--sp-5) * -1); padding-left:var(--sp-5); padding-right:var(--sp-5); }
.recent-row .r-title{ font-weight:600; font-size:13.5px; }
.recent-row .r-sub{ font-size:11.5px; color:var(--text-muted); margin-top:2px; }

/* =========================================================================
   MODAL / OVERLAY
   ========================================================================= */
.overlay{
  position:fixed; inset:0; background:rgba(20,20,20,.42);
  display:none; align-items:center; justify-content:center; z-index:var(--z-modal); padding:var(--sp-4);
}
.overlay.active{ display:flex; }
.modal{
  background:var(--bg-surface); border-radius:var(--radius-lg); max-width:640px; width:100%;
  max-height:88vh; overflow:auto; box-shadow:var(--shadow-modal);
}
.modal-head{ padding:var(--sp-5); border-bottom:1px solid var(--border-default); display:flex; justify-content:space-between; align-items:center; }
.modal-head h3{ margin:0; font-size:15.5px; font-weight:700; }
.modal-body{ padding:var(--sp-5); display:flex; flex-direction:column; gap:var(--sp-3); }
.modal-foot{ padding:var(--sp-4) var(--sp-5); border-top:1px solid var(--border-default); display:flex; justify-content:flex-end; gap:var(--sp-3); flex-wrap:wrap; }
.close-x{ background:none; border:none; font-size:16px; color:var(--text-muted); width:28px; height:28px; border-radius:var(--radius-sm); }
.close-x:hover{ background:var(--bg-surface-sunken); color:var(--text-primary); }

/* =========================================================================
   TOAST
   ========================================================================= */
.toast-wrap{ position:fixed; bottom:80px; left:50%; transform:translateX(-50%); z-index:var(--z-toast); display:flex; flex-direction:column; gap:var(--sp-2); }
.toast{ background:var(--text-primary); color:#fff; padding:10px 18px; border-radius:var(--radius-md); font-size:13px; box-shadow:var(--shadow-elevated); }

/* =========================================================================
   EMPTY STATE / SKELETON
   ========================================================================= */
.empty{ padding:var(--sp-9) var(--sp-4); text-align:center; color:var(--text-muted); font-size:13.5px; }
.empty-state{ text-align:center; padding:var(--sp-10) var(--sp-5); }
.empty-state .icon{ font-size:34px; color:var(--border-strong); margin-bottom:var(--sp-3); }
.empty-state h3{ font-size:15px; margin:0 0 4px; color:var(--text-primary); }
.empty-state p{ font-size:13px; color:var(--text-muted); margin:0 0 var(--sp-4); }
.skel{ background:linear-gradient(90deg, var(--bg-surface-sunken) 25%, #E6E4DC 37%, var(--bg-surface-sunken) 63%); background-size:400% 100%; animation:skel-shimmer 1.4s ease infinite; border-radius:var(--radius-sm); }
@keyframes skel-shimmer{ 0%{background-position:100% 0;} 100%{background-position:0 0;} }

/* =========================================================================
   SETTINGS SWITCH
   ========================================================================= */
.settings-row{ display:flex; justify-content:space-between; align-items:center; padding:var(--sp-3) 0; border-bottom:1px solid var(--border-default); gap:var(--sp-4); }
.settings-row:last-child{ border-bottom:none; }
.switch{ position:relative; display:inline-block; width:40px; height:22px; flex-shrink:0; }
.switch input{ opacity:0; width:0; height:0; }
.switch .slider{ position:absolute; inset:0; background:var(--border-strong); border-radius:22px; transition:.15s; cursor:pointer; }
.switch .slider::before{ content:''; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; }
.switch input:checked + .slider{ background:var(--color-primary); }
.switch input:checked + .slider::before{ transform:translateX(18px); }

/* =========================================================================
   TRANSACTION LINES (expand) / MISC
   ========================================================================= */
.txn-lines{ background:var(--bg-surface-sunken); }
.txn-lines td{ border-bottom:1px solid var(--border-default); }
.expand-btn{ background:none; border:none; color:var(--color-primary); font-size:12px; }
tr.voided td{ opacity:.5; }

/* =========================================================================
   MOBILE STICKY SAVE BAR
   ========================================================================= */
.mobile-sticky-save{ display:none; }
@media (max-width:767px){
  .mobile-sticky-save{
    display:flex; position:fixed; left:0; right:0; bottom:var(--bottom-nav-h); z-index:var(--z-sticky);
    background:var(--text-primary); color:#fff; padding:12px var(--sp-5); align-items:center; justify-content:space-between;
    font-size:12.5px; box-shadow:0 -4px 16px rgba(0,0,0,.15);
  }
  .mobile-sticky-save .sticky-total{ font-size:15px; font-weight:700; }
  .mobile-sticky-save .btn{ padding:9px 16px; font-size:13px; }
  .lines-wrap{ padding-bottom:8px; }
}

/* =========================================================================
   RESPONSIVE: SIDEBAR / HEADER / BOTTOM NAV
   ========================================================================= */
.bottom-nav{ display:none; }

/* Tablet: 768–1023px — compact sidebar (icons only) */
@media (min-width:768px) and (max-width:1023px){
  .sidebar{ width:72px; }
  .brand{ padding:var(--sp-4) 0; justify-content:center; }
  .brand-text{ display:none; }
  .nav{ align-items:center; padding:var(--sp-2); }
  .nav button{ justify-content:center; width:48px; padding:10px 0; }
  .nav button span:not(.icon){ display:none; }
  .sidebar-foot{ display:none; }
  .header-search{ width:180px; }
  .content{ padding:var(--sp-5); }
}

/* Mobile: <768px — bottom nav, no sidebar, hamburger not needed (bottom nav covers primary) */
@media (max-width:767px){
  .sidebar{ display:none; }
  .bottom-nav{
    display:flex; position:fixed; bottom:0; left:0; right:0; height:var(--bottom-nav-h);
    background:var(--bg-surface); z-index:var(--z-sidebar); border-top:1px solid var(--border-default);
  }
  .bottom-nav button{
    flex:1; background:none; border:none; color:var(--text-muted); padding:8px 2px 6px;
    display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; font-weight:600;
  }
  .bottom-nav button.active{ color:var(--color-primary); }
  .bottom-nav button .icon{ font-size:19px; }
  .content{ padding:var(--sp-4) var(--sp-4) calc(var(--bottom-nav-h) + var(--sp-6)); }
  .app-header{ padding:0 var(--sp-4); height:52px; }
  .header-search{ display:none; }
  .header-date{ display:none; }
  .header-left h1{ font-size:15px; }
}
@media (max-width:420px){
  .grid-4{ grid-template-columns:1fr; }
}

/* =========================================================================
   RESPONSIVE TABLE → CARD (Transaction line editor, on mobile only)
   Uses data-label on <td> so cells can reflow into labeled rows
   ========================================================================= */
@media (max-width:767px){
  .lines-table-wrap table, .lines-table-wrap thead, .lines-table-wrap tbody, .lines-table-wrap tr, .lines-table-wrap td{ display:block; width:100%; }

/* ========================================================================= API LAYER ========================================================================= */
async function apiGet(action, extraParams){
  if(!isLive()) return null;
  let url = CONFIG.API_URL + '?action=' + encodeURIComponent(action);
  if(extraParams) Object.keys(extraParams).forEach(k=>{ url += '&'+k+'='+encodeURIComponent(extraParams[k]); });
  const res = await fetch(url);
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'API error');
  return json.data;
}
async function apiPost(action, body){
  if(!isLive()) return null;
  const res = await fetch(CONFIG.API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({action}, body))});
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'API error');
  return json.data;
}

async function loadAll(){
  if(isLive()){
    try{
      const all = await apiGet('getall');
      STATE.products = all.products || [];
      STATE.categories = all.categories && all.categories.length ? all.categories : SEED_CATEGORIES;
      STATE.keywords = all.keywords || [];
      STATE.transactions = all.transactions || [];
      STATE.lines = all.lines || [];
      STATE.stockMovements = all.stockMovements || [];
      STATE.settings = all.settings || STATE.settings;
    }catch(err){
      toast('เชื่อมต่อ Google Sheets ไม่สำเร็จ: ' + err.message + ' — สลับเป็นโหมดสาธิต');
      CONFIG.API_URL = '';
      loadDemoData();
    }
  } else {
    loadDemoData();
  }
}

  STATE.products = buildSeedProducts();

}

/* ========================================================================= FORMAT HELPERS ========================================================================= */
const fmtMoney = n => (n===''||n===null||n===undefined||isNaN(n)) ? '-' : Number(n).toLocaleString('th-TH',{maximumFractionDigits:2});
const todayStr = () => new Date().toISOString().slice(0,10);
function daysAgoStr(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }
function round2(n){ return Math.round(n*100)/100; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function uid(prefix){ return prefix + Math.random().toString(36).slice(2,9); }

/* ========================================================================= SMART PARSER (validated against spec examples) ========================================================================= */
function normalizeKey(s){ return String(s).toLowerCase().replace(/[\s\-]/g,''); }

function findLearnedKeyword(text){
  const matches = STATE.keywords
    .filter(k => k.active !== false && k.active !== 'FALSE' && text.indexOf(k.keyword) > -1)
    .sort((a,b)=> (String(b.keyword).length - String(a.keyword).length) || ((b.priority||1)-(a.priority||1)));
  return matches[0] || null;
}
function findCategoryMatch(text){
  let best = null;
  STATE.categories.forEach(cat=>{
    if(cat.active===false || cat.active==='FALSE') return;
    String(cat.keywords||'').split(',').map(s=>s.trim()).filter(Boolean).forEach(kw=>{
      const idx = text.indexOf(kw);
      if(idx > -1){
        const candidate = {category:cat.category_name, type:cat.type, matchedKeyword:kw, keywordIndex:idx, length:kw.length};
        if(!best || candidate.length > best.length || (candidate.length===best.length && candidate.keywordIndex < best.keywordIndex)) best = candidate;
      }
    });
  });
  return best;
}
function matchProducts(searchText){
  const norm = normalizeKey(searchText);
  if(!norm) return [];
  const scored = [];
  STATE.products.forEach(p=>{
    if(p.active===false || p.active==='FALSE') return;
    const aliases = [p.model, p.product_name, p.brand+p.model].concat(String(p.keywords||'').split(','));
    let best = 0;
    aliases.filter(Boolean).forEach(alias=>{
      const a = normalizeKey(alias);
      if(!a) return;
      let score = 0;
      if(norm === a) score = 3000 + a.length;
      else if(norm.indexOf(a) > -1) score = 2000 + a.length;
      else if(a.indexOf(norm) > -1) score = 1000 + norm.length;
      best = Math.max(best, score);
    });
    if(best>0) scored.push({product:p, score:best});
  });
  scored.sort((a,b)=>b.score-a.score);
  return scored;
}

function parseSegmentRaw(rawSeg){
  const draft = {
    id: uid('d'), raw: rawSeg, type:null, category:null, product_id:null, product_name:null,
    description:'', quantity:1, unit:'', unit_price:null, total:null, cost:null, profit:null,
    is_service_usage:false, needsTypeChoice:false, needsProductChoice:false, productCandidates:[],
    productNotFound:false, searchedName:'', categoryNotFound:false, note:rawSeg
  };
  let text = rawSeg.trim().replace(/,/g,'');
  if(!text) return null;

  let costOverride = null;
  const costM = text.match(/ทุน\s*([\d.]+)/);
  if(costM){ costOverride = parseFloat(costM[1]); text = text.replace(costM[0],' ').trim(); }
  const partsCostM = text.match(/ค่าอะไหล่\s*([\d.]+)/);
  let partsCostLegacy = null;
  if(partsCostM){ partsCostLegacy = parseFloat(partsCostM[1]); text = text.replace(partsCostM[0],' ').trim(); }

  let partUsage = null;
  const useRe = new RegExp('ใช้\\s*([\\u0E00-\\u0E7Fa-zA-Z0-9\\- ]+?)\\s*(\\d+(?:\\.\\d+)?)\\s*(' + UNIT_WORDS.join('|') + ')');
  const useM = text.match(useRe);
  if(useM){ partUsage = { nameText: useM[1].trim(), quantity: parseFloat(useM[2]), unit: useM[3] }; text = text.replace(useM[0],' ').trim(); }

  let explicitUnitPrice = null;
  const perUnitRe = new RegExp('(' + UNIT_WORDS.join('|') + ')ละ\\s*([\\d.]+)');
  const perUnitM = text.match(perUnitRe);
  if(perUnitM){ explicitUnitPrice = parseFloat(perUnitM[2]); text = text.replace(perUnitM[0],' ').trim(); }

  const learned = findLearnedKeyword(text);
  let catMatch = findCategoryMatch(text);
  let type=null, category=null, matchedKeywordText=null, usedLearned=false;
  if(learned && learned.type){ type=learned.type; category=learned.category; matchedKeywordText=learned.keyword; usedLearned=true; }
  else if(catMatch){ type=catMatch.type; category=catMatch.category; matchedKeywordText=catMatch.matchedKeyword; }

  let isRepair = category==='ค่าซ่อม' || (!category && text.indexOf('ซ่อม')>-1);

  if(text.indexOf('จ่ายค่าซ่อม')>-1){ type='expense'; category='ค่าซ่อม(จ่าย)'; isRepair=true; }
  else if(!type && text.indexOf('ซ่อม')>-1){ type='income'; category='ค่าซ่อม'; }

  if(!type){
    const GENERIC_INCOME=['ขาย','รับเงิน','เก็บเงิน'];
    const GENERIC_EXPENSE=['ซื้อ','จ่าย','ค่า'];
    if(GENERIC_INCOME.some(k=>text.indexOf(k)>-1)) type='income';
    else if(GENERIC_EXPENSE.some(k=>text.indexOf(k)>-1)) type='expense';
  }
  draft.type = type; draft.category = category;

  const tokens = text.split(/\s+/).filter(Boolean);
  const numRe = /^\d+(\.\d+)?$/;
  let quantity=null, qtyIdx=-1, unitIdx=-1, unit='';
  for(let i=0;i<tokens.length-1;i++){
    if(numRe.test(tokens[i]) && UNIT_WORDS.indexOf(tokens[i+1])>-1){ quantity=parseFloat(tokens[i]); unit=tokens[i+1]; qtyIdx=i; unitIdx=i+1; break; }
  }
  const usedIdx = new Set([qtyIdx,unitIdx].filter(i=>i>-1));
  const remainingNums = tokens.map((t,i)=>({t,i})).filter(o=>numRe.test(o.t) && !usedIdx.has(o.i));

  let unitPrice = explicitUnitPrice;
  if(unitPrice===null){
    if(remainingNums.length>=2){
      // v3.1: รองรับรูปแบบตาราง "รายการ ราคา จำนวน" ที่ไม่มีคำหน่วยกำกับ เช่น "810 850 2"
      // ตัวเลข 2 ตัวท้ายสุดที่อยู่ติดกัน = (ราคาต่อหน่วย, จำนวน) ถ้ามีข้อความ/รหัสสินค้าเหลือไว้ก่อนหน้า
      // (ไม่นับคำสำคัญของหมวดที่ match ไปแล้ว เช่น "ขายหมึก") ถ้าไม่มีอะไรเหลือเลย (เช่น "2010 900")
      // ยังถือว่าคลุมเครือ ใช้กติกาเดิม (ตัวท้ายสุด=ราคา, จำนวน=1)
      const keywordTokenIdx = matchedKeywordText ? tokens.indexOf(matchedKeywordText) : -1;
      const last = remainingNums[remainingNums.length-1];
      const secondLast = remainingNums[remainingNums.length-2];
      const consecutive = last.i === secondLast.i+1;
      let leftoverCount = 0;
      for(let k=0;k<secondLast.i;k++){ if(k!==keywordTokenIdx) leftoverCount++; }
      if(consecutive && leftoverCount>0){
        quantity = parseFloat(last.t);
        unitPrice = parseFloat(secondLast.t);
        usedIdx.add(last.i); usedIdx.add(secondLast.i);
      } else {
        unitPrice = parseFloat(last.t);
        usedIdx.add(last.i);
      }
    } else if(remainingNums.length===1){
      unitPrice = parseFloat(remainingNums[0].t);
      usedIdx.add(remainingNums[0].i);
    }
  }
  if(quantity===null) quantity=1;
  draft.quantity=quantity; draft.unit=unit; draft.unit_price = unitPrice;
  draft.subtotal = unitPrice!==null ? round2(quantity*unitPrice) : null;
  draft.discount = 0;
  draft.total = draft.subtotal;

  const searchTokens = tokens.filter((t,i)=>{
    if(usedIdx.has(i)) return false;
    if(['ขาย','ซื้อ','ซ่อม','ค่า','จ่าย'].indexOf(t)>-1) return false;
    return true;
  });
  let searchText = searchTokens.join(' ');
  if(matchedKeywordText) searchText = searchText.replace(new RegExp(escapeRegex(matchedKeywordText),'gi'),' ').trim();

  if(isRepair){
    const cands = matchProducts(searchText);
    if(cands.length){
      const top = cands[0].score; const tied = cands.filter(c=>c.score===top);
      const uniq = [...new Set(tied.map(c=>c.product.product_id))];
      if(uniq.length===1){ draft.product_name = tied[0].product.product_name; }
    }
    draft.description = searchText;
    draft.product_name = draft.product_name || searchText;
  } else if(searchText){
    const cands = matchProducts(searchText);
    if(cands.length){
      const top = cands[0].score; const tied = cands.filter(c=>c.score===top);
      const uniq = [...new Set(tied.map(c=>c.product.product_id))];
      if(uniq.length===1){
        const matched = tied[0].product;
        const repairRelated = ['ค่าซ่อม','ค่าซ่อม(จ่าย)','ค่าอะไหล่'].indexOf(category) > -1;
        if(repairRelated && matched.category === 'เครื่องพิมพ์'){
          draft.product_name = matched.product_name; draft.description = matched.product_name;
        } else { draft.product_id = matched.product_id; draft.product_name = matched.product_name; }
      } else { draft.needsProductChoice = true; draft.productCandidates = tied.map(c=>c.product); }
    } else { draft.searchedName = searchText; draft.productNotFound = true; }
  }

  draft._costOverride = costOverride !== null ? costOverride : partsCostLegacy;
  draft._partUsage = partUsage;
  draft._usedLearnedKeyword = usedLearned;
  return draft;
}

/** สเปคข้อ 2: Confidence Score เป็น % ให้ทุกบรรทัดเสมอ */
function computeConfidence(d){
  if(d.needsTypeChoice) return 20;
  if(d.needsProductChoice) return 45;
  if(d.productNotFound) return 35;
  let score = 99;
  if(d._usedLearnedKeyword) return 99; // ผู้ใช้เคยยืนยัน mapping นี้มาก่อนแล้ว (USER_CORRECTION)
  if(d.inheritedType) score -= 15;
  if(d.categoryNotFound) score -= 20;
  if(d.unit_price===null || d.unit_price===undefined) score -= 25;
  if(!d.product_id && !d.is_service_usage && d.category!=='ค่าซ่อม' && d.category!=='ค่าซ่อม(จ่าย)' && !['ค่าใช้จ่าย','รับเงิน'].includes(d.category)) score -= 5;
  return Math.max(5, Math.min(99, Math.round(score)));
}

/** v3.1: แยกข้อความเป็นรายการย่อย รองรับทั้งรูปแบบเดิม (คั่นด้วยจุลภาคในบรรทัดเดียว)
 *  และรูปแบบใหม่ (หนึ่งบรรทัด = หนึ่งรายการ, หรือวางมาจาก Excel/Sheets ที่คั่นด้วย Tab) */
function splitInputIntoSegments(fullText){
  const rawLines = fullText.split('\n').map(l=>l.replace(/\r$/,'')).map(l=>l.trim()).filter(Boolean);
  const out = [];
  rawLines.forEach(line=>{
    if(line.indexOf('\t') > -1){
      out.push({raw: line, isTableRow: true});
    } else {
      line.split(',').map(s=>s.trim()).filter(Boolean).forEach(seg=> out.push({raw: seg, isTableRow: false}));
    }
  });
  return out;
}

/** ตรวจจับประเภท/หมวด/สินค้าจากข้อความชื่อรายการล้วนๆ (ไม่มีตัวเลขราคา/จำนวนปน) — ใช้กับแถวตารางที่วางมาแบบมีคอลัมน์ราคา/จำนวนแยกชัดเจนอยู่แล้ว */
function classifySegment(text){
  text = String(text||'').trim();
  const learned = findLearnedKeyword(text);
  let catMatch = findCategoryMatch(text);
  let type=null, category=null, matchedKeywordText=null, usedLearned=false;
  if(learned && learned.type){ type=learned.type; category=learned.category; matchedKeywordText=learned.keyword; usedLearned=true; }
  else if(catMatch){ type=catMatch.type; category=catMatch.category; matchedKeywordText=catMatch.matchedKeyword; }

  let isRepair = category==='ค่าซ่อม' || (!category && text.indexOf('ซ่อม')>-1);
  if(text.indexOf('จ่ายค่าซ่อม')>-1){ type='expense'; category='ค่าซ่อม(จ่าย)'; isRepair=true; }
  else if(!type && text.indexOf('ซ่อม')>-1){ type='income'; category='ค่าซ่อม'; }

  if(!type){
    const GENERIC_INCOME=['ขาย','รับเงิน','เก็บเงิน'];
    const GENERIC_EXPENSE=['ซื้อ','จ่าย','ค่า'];
    if(GENERIC_INCOME.some(k=>text.indexOf(k)>-1)) type='income';
    else if(GENERIC_EXPENSE.some(k=>text.indexOf(k)>-1)) type='expense';
  }

  let searchText = text;
  if(matchedKeywordText) searchText = searchText.replace(new RegExp(escapeRegex(matchedKeywordText),'gi'),' ').trim();
  searchText = searchText.split(/\s+/).filter(t=>['ขาย','ซื้อ','ซ่อม','ค่า','จ่าย'].indexOf(t)===-1).join(' ').trim();

  const result = {
    type, category, product_id:null, product_name:null, description:'',
    needsProductChoice:false, productCandidates:[], productNotFound:false, searchedName:'',
    categoryNotFound:false, _usedLearnedKeyword: usedLearned
  };

  if(isRepair){
    const cands = matchProducts(searchText);
    if(cands.length){
      const top = cands[0].score; const tied = cands.filter(c=>c.score===top);
      const uniq = [...new Set(tied.map(c=>c.product.product_id))];
      if(uniq.length===1) result.product_name = tied[0].product.product_name;
    }
    result.description = searchText;
    result.product_name = result.product_name || searchText || text;
  } else if(searchText){
    const cands = matchProducts(searchText);
    if(cands.length){
      const top = cands[0].score; const tied = cands.filter(c=>c.score===top);
      const uniq = [...new Set(tied.map(c=>c.product.product_id))];
      if(uniq.length===1){
        const matched = tied[0].product;
        const repairRelated = ['ค่าซ่อม','ค่าซ่อม(จ่าย)','ค่าอะไหล่'].indexOf(category) > -1;
        if(repairRelated && matched.category === 'เครื่องพิมพ์'){ result.product_name = matched.product_name; result.description = matched.product_name; }
        else { result.product_id = matched.product_id; result.product_name = matched.product_name; }
      } else { result.needsProductChoice = true; result.productCandidates = tied.map(c=>c.product); }
    } else { result.searchedName = searchText; result.productNotFound = true; }
  } else {
    result.searchedName = text; result.productNotFound = true;
  }
  return result;
}

/** v3.1: แถวจากการวาง Excel/Google Sheets (คั่นด้วย Tab) — คอลัมน์ชัดเจนอยู่แล้ว ไม่ต้องเดา */
function parseTableRow(row){
  const cols = row.split('\t').map(c=>c.trim());
  const joinedLower = cols.join(' ').toLowerCase();
  const looksHeader = /ราคาต่อหน่วย|จำนวน|ราคารวม|รายการ|unit\s*price|quantity|^total$/i.test(joinedLower)
    && !(cols[1] && /^[\d.,]+$/.test(cols[1]));
  if(looksHeader || !cols[0]) return null;

  const numRe = /^[\d.,]+$/;
  const name = cols[0];
  const price = cols[1] && numRe.test(cols[1]) ? parseFloat(cols[1].replace(/,/g,'')) : null;
  const qty = cols[2] && numRe.test(cols[2]) ? parseFloat(cols[2].replace(/,/g,'')) : 1;
  const pastedTotal = cols[3] && numRe.test(cols[3]) ? parseFloat(cols[3].replace(/,/g,'')) : null;

  const info = classifySegment(name);
  const draft = Object.assign({
    id: uid('d'), raw: row, quantity: qty, unit:'', unit_price: price, discount: 0,
    needsTypeChoice:false, note: row
  }, info);
  draft.subtotal = price!==null ? round2(qty*price) : null;
  draft.total = draft.subtotal;
  // สเปคข้อ 3: Total ที่วางมาใช้ตรวจสอบเท่านั้น ค่าที่คำนวณได้เป็น Source of Truth เสมอ
  if(pastedTotal!==null && draft.total!==null && Math.abs(pastedTotal-draft.total)>0.01){
    draft._totalMismatchNote = 'ราคารวมที่วางมา ('+pastedTotal.toLocaleString('th-TH')+') ไม่ตรงกับที่คำนวณได้ — ใช้ค่าที่คำนวณได้แทน';
  }
  return draft;
}

function parseMultiLineText(fullText){
  const segments = splitInputIntoSegments(fullText);
  let drafts = []; let carryType = null;
  segments.forEach(seg=>{
    const d = seg.isTableRow ? parseTableRow(seg.raw) : parseSegmentRaw(seg.raw);
    if(!d) return;
    if(!d.type && carryType){ d.type = carryType; d.inheritedType = true; }
    if(d.type) carryType = d.type;
    drafts.push(d);

    if(d._partUsage){
      const pu = d._partUsage;
      const partDraft = {
        id: uid('d'), raw: 'ใช้ '+pu.nameText+' '+pu.quantity+' '+pu.unit,
        type:'expense', category:'ค่าอะไหล่', product_id:null, product_name:null, description:'',
        quantity: pu.quantity, unit: pu.unit, unit_price:null, total:null, cost:null, profit:null,
        is_service_usage:true, needsProductChoice:false, productCandidates:[],
        productNotFound:false, searchedName:pu.nameText, categoryNotFound:false, note:''
      };
      const cands = matchProducts(pu.nameText);
      if(cands.length){
        const top=cands[0].score; const tied=cands.filter(c=>c.score===top);
        const uniq=[...new Set(tied.map(c=>c.product.product_id))];
        if(uniq.length===1){ partDraft.product_id=tied[0].product.product_id; partDraft.product_name=tied[0].product.product_name; }
        else { partDraft.needsProductChoice=true; partDraft.productCandidates=tied.map(c=>c.product); }
      } else { partDraft.productNotFound = true; }
      const prod = partDraft.product_id ? STATE.products.find(p=>p.product_id===partDraft.product_id) : null;
      let up = d._costOverride;
      if(up===null && prod && prod.cost!==''&&prod.cost!=null) up = Number(prod.cost);
      partDraft.unit_price = up; partDraft.total = up!==null ? round2(pu.quantity*up) : null; partDraft.cost = up;
      partDraft.confidence = computeConfidence(partDraft);
      drafts.push(partDraft);
    }
  });

  drafts.forEach(d=>{
    if(!d.type){ d.needsTypeChoice = true; }
    if(!d.category && d.type && d.product_id){
      const prod = STATE.products.find(p=>p.product_id===d.product_id);
      if(prod){
        const HINT = {'เครื่องพิมพ์':'เครื่อง','หมึก':'หมึก','ตลับหมึก':'ตลับ','แผ่นซับหมึก':'แผ่น','ทั่วไป':'อะไหล่'};
        const hint = HINT[prod.category] || prod.category;
        const guess = STATE.categories.find(c=>c.type===d.type && hint && c.category_name.indexOf(hint)>-1);
        if(guess) d.category = guess.category_name;
      }
    }
    if(!d.category && d.type && !d.is_service_usage && d.category!=='ค่าซ่อม' && d.category!=='ค่าซ่อม(จ่าย)'){
      if(d.searchedName){ d.categoryNotFound = true; }
      else { d.category = d.type==='income' ? 'รับเงิน' : 'ค่าใช้จ่าย'; }
    }
    if(d.productNotFound && !d.searchedName) d.productNotFound = false;
    if(d.type==='income' && d.product_id){
      const prod = STATE.products.find(p=>p.product_id===d.product_id);
      if(prod){
        const unitCost = prod.average_cost!==''&&prod.average_cost!=null ? Number(prod.average_cost) : (prod.cost!==''&&prod.cost!=null ? Number(prod.cost) : null);
        if(unitCost!==null){ d.cost = round2(unitCost*d.quantity); d.profit = round2((d.total||0)-d.cost); }
      }
    }
    d.confidence = computeConfidence(d);
    d.discount = d.discount || 0;
  });
  return drafts;
}

/* ========================================================================= LOCAL (demo-mode) TRANSACTION ENGINE — mirrors Code.gs business logic ========================================================================= */
function localApplyStockDelta(productId, delta, refTx, refLine, type, note){
  const p = STATE.products.find(pp=>pp.product_id===productId);
  if(!p) return;
  p.stock = round2((Number(p.stock)||0)+delta);
  STATE.stockMovements.unshift({
    movement_id: uid('M'), date: todayStr(), product_id:productId, product_name:p.product_name,
    type: type||(delta>=0?'PURCHASE':'SALE'), quantity: Math.abs(delta),
    reference_transaction: refTx||'', reference_line: refLine||'', reason:note||'', created_at:new Date().toISOString()
  });
}
function localRecordAverageCost(productId, qty, unitCost){
  const p = STATE.products.find(pp=>pp.product_id===productId);
  if(!p) return;
  const oldStock = Number(p.stock)||0; // ยังไม่บวก qty ใหม่เข้าไป (เรียกก่อน applyStockDelta)
  const oldAvg = (p.average_cost===''||p.average_cost==null) ? null : Number(p.average_cost);
  let newAvg;
  if(oldStock<=0 || oldAvg===null) newAvg = Number(unitCost);
  else newAvg = ((oldStock*oldAvg)+(Number(qty)*Number(unitCost)))/(oldStock+Number(qty));
  p.average_cost = round2(newAvg);
  p.cost = Number(unitCost);
}
function localReadCost(p){
  if(p.average_cost!==''&&p.average_cost!=null) return Number(p.average_cost);
  if(p.cost!==''&&p.cost!=null) return Number(p.cost);
  return null;
}
function localSaveLine(txId, line){
  line.line_id = line.line_id || uid('L');
  line.transaction_id = txId;
  const qty = Number(line.quantity)||0, up = Number(line.unit_price)||0;
  line.subtotal = round2(qty*up);
  let discount = Number(line.discount)||0;
  if(discount > line.subtotal) discount = line.subtotal;
  line.discount = discount;
  line.total = round2(line.subtotal - discount);

  let stockEffect=0, movementType=null;
  if(line.product_id){
    if(line.is_return){ stockEffect=Math.abs(qty); movementType='RETURN'; }
    else if(line.is_service_usage){ stockEffect=-Math.abs(qty); movementType='SERVICE_USAGE'; }
    else if(line.type==='income'){ stockEffect=-Math.abs(qty); movementType='SALE'; }
    else { stockEffect=Math.abs(qty); movementType='PURCHASE'; }
  }
  line.stock_effect = stockEffect;

  if(line.type==='income' && line.product_id && !line._skipCostCalc){
    const prod = STATE.products.find(p=>p.product_id===line.product_id);
    const unitCost = prod ? localReadCost(prod) : null;
    if(unitCost!==null){ line.cost = round2(unitCost*qty); line.profit = round2(line.total-line.cost); }
    else { line.cost=''; line.profit=''; }
  }

  STATE.lines.push(line);
  if(line.product_id && stockEffect!==0){
    if(movementType==='PURCHASE') localRecordAverageCost(line.product_id, qty, up);
    const refTx = line._referenceTransactionOverride || txId;
    localApplyStockDelta(line.product_id, stockEffect, refTx, line.line_id, movementType, line.note||'');
  }
  return line;
}
function localGenerateTransactionId(dateStr){
  dateStr = dateStr || todayStr();
  const compact = dateStr.replace(/-/g,'');
  const prefix = 'TX-'+compact+'-';
  let max = 0;
  STATE.transactions.forEach(t=>{ if(String(t.transaction_id).indexOf(prefix)===0){ const n=parseInt(String(t.transaction_id).split('-').pop(),10); if(!isNaN(n)&&n>max) max=n; } });
  return prefix+String(max+1).padStart(3,'0');
}
function localFindByClientRequestId(cid){
  if(!cid) return null;
  return STATE.transactions.find(t=>t.client_request_id && t.client_request_id===cid) || null;
}
function localAddTransaction(tx, lines, clientRequestId, opts){
  opts = opts || {};
  if(clientRequestId){
    const dup = localFindByClientRequestId(clientRequestId);
    if(dup) return { transaction:dup, lines: STATE.lines.filter(l=>l.transaction_id===dup.transaction_id), duplicate:true };
  }
  tx.transaction_id = opts.reuseTransactionId || tx.transaction_id || localGenerateTransactionId(tx.transaction_date);
  tx.transaction_date = tx.transaction_date || todayStr();
  tx.status = tx.status || 'ACTIVE';
  tx.created_at = tx.created_at || new Date().toISOString();
  tx.client_request_id = clientRequestId || '';
  let total_income=0, total_expense=0, total_cost=0;
  const saved = lines.map(l=>{
    const s = localSaveLine(tx.transaction_id, l);
    if(s.type==='income') total_income += Number(s.total)||0; else total_expense += Number(s.total)||0;
    if(s.type==='income' && s.cost!==''&&s.cost!=null) total_cost += Number(s.cost)||0;
    return s;
  });
  tx.total_income=round2(total_income); tx.total_expense=round2(total_expense);
  tx.total_cost=round2(total_cost); tx.gross_profit=round2(total_income-total_cost); tx.net_profit=tx.gross_profit;
  // v4.0: Payment Status + ยอดชำระบางส่วน (สเปคข้อ 12) — ถ้าไม่ได้ระบุมา อนุมานจากยอด
  let amountPaid = tx.amount_paid!==undefined && tx.amount_paid!=='' ? Number(tx.amount_paid) : null;
  if(amountPaid===null) amountPaid = tx.payment_method==='ค้างชำระ' ? 0 : tx.total_income;
  amountPaid = Math.max(0, Math.min(amountPaid, tx.total_income));
  let paymentStatus = tx.payment_status;
  if(!paymentStatus){
    if(tx.total_income<=0) paymentStatus='ชำระแล้ว';
    else if(amountPaid<=0) paymentStatus='ค้างชำระ';
    else if(amountPaid>=tx.total_income) paymentStatus='ชำระแล้ว';
    else paymentStatus='ชำระบางส่วน';
  }
  tx.amount_paid = round2(amountPaid);
  tx.payment_status = paymentStatus;
  STATE.transactions.unshift(tx);
  return {transaction:tx, lines:saved};
}
function localReverseLineStockEffect(l, note){
  if(!l.product_id || !Number(l.stock_effect)) return;
  const effect = Number(l.stock_effect);
  let reverseType = effect<0 ? 'SALE_REVERSAL' : (l.is_service_usage ? 'SERVICE_USAGE_REVERSAL' : 'PURCHASE_REVERSAL');
  if(l.is_return) reverseType = effect>0 ? 'ADJUSTMENT_DECREASE' : 'ADJUSTMENT_INCREASE';
  localApplyStockDelta(l.product_id, -effect, l.transaction_id, l.line_id, reverseType, note);
}
function localUpdateTransaction(txId, tx, lines){
  const oldTx = STATE.transactions.find(t=>t.transaction_id===txId);
  if(!oldTx) throw new Error('ไม่พบรายการ');
  if(oldTx.status==='VOID') throw new Error('รายการนี้ถูกยกเลิกแล้ว ไม่สามารถแก้ไขได้');
  STATE.lines.filter(l=>l.transaction_id===txId).forEach(l=> localReverseLineStockEffect(l, 'ย้อนกลับจากการแก้ไขรายการ '+txId));
  STATE.lines = STATE.lines.filter(l=>l.transaction_id!==txId);
  STATE.transactions = STATE.transactions.filter(t=>t.transaction_id!==txId);
  const merged = Object.assign({}, oldTx, tx, {client_request_id: oldTx.client_request_id});
  return localAddTransaction(merged, lines, null, {reuseTransactionId:txId});
}
function localVoidTransaction(txId, reason){
  const tx = STATE.transactions.find(t=>t.transaction_id===txId);
  if(!tx) throw new Error('ไม่พบรายการ');
  if(tx.status==='VOID') throw new Error('รายการนี้ถูกยกเลิกไปแล้ว');
  STATE.lines.filter(l=>l.transaction_id===txId).forEach(l=> localReverseLineStockEffect(l, 'ยกเลิกรายการ (VOID): '+(reason||'')));
  tx.status = 'VOID';
  return tx;
}
function localReturnLine(originalTxId, originalLineId, quantity, reason){
  const originalLine = STATE.lines.find(l=>l.transaction_id===originalTxId && l.line_id===originalLineId);
  if(!originalLine) throw new Error('ไม่พบรายการเดิม');
  if(originalLine.type!=='income' || !originalLine.product_id || originalLine.is_service_usage) throw new Error('รายการนี้คืนสินค้าไม่ได้');
  const qty = Number(quantity)||0;
  if(qty<=0 || qty>Number(originalLine.quantity)) throw new Error('จำนวนคืนไม่ถูกต้อง');
  const priorReturns = STATE.stockMovements.filter(m=>m.type==='RETURN'&&m.reference_transaction===originalTxId&&m.reference_line===originalLineId).reduce((s,m)=>s+(Number(m.quantity)||0),0);
  if(priorReturns+qty > Number(originalLine.quantity)) throw new Error('จำนวนคืนสะสมเกินยอดขายเดิม');
  const returnLine = {
    type:'expense', category:'คืนสินค้า', product_id:originalLine.product_id, product_name:originalLine.product_name,
    description:'คืนสินค้าจาก '+originalTxId, quantity:qty, unit:originalLine.unit, unit_price:originalLine.unit_price,
    discount:0, is_return:true, note:reason||'', _referenceTransactionOverride:originalTxId, _skipCostCalc:true
  };
  const newTx = { transaction_date: todayStr(), note:'คืนสินค้าอ้างอิง '+originalTxId };
  return localAddTransaction(newTx, [returnLine], null, {});
}
function localRefundLine(originalTxId, originalLineId, amount, reason){
  const originalLine = STATE.lines.find(l=>l.transaction_id===originalTxId && l.line_id===originalLineId);
  if(!originalLine) throw new Error('ไม่พบรายการเดิม');
  if(originalLine.type!=='income') throw new Error('รายการนี้ไม่ใช่รายรับ ไม่สามารถคืนเงินได้');
  const amt = Number(amount)||0;
  if(amt<=0) throw new Error('จำนวนเงินคืนไม่ถูกต้อง');
  const refKey = 'REFUND_OF:'+originalTxId+':'+originalLineId;
  const priorRefunds = STATE.lines.filter(l=>l.description===refKey).reduce((s,l)=>s+(Number(l.total)||0),0);
  if(priorRefunds+amt > Number(originalLine.total)+0.01) throw new Error('ยอดคืนเงินสะสมเกินกว่ายอดรายการเดิม');
  const refundLineObj = {
    type:'expense', category:'คืนเงิน', product_id:'', product_name:'',
    description:refKey, quantity:1, unit:'', unit_price:amt, discount:0,
    note:'คืนเงินจาก '+originalTxId+(reason?' — '+reason:''), _skipCostCalc:true
  };
  const newTx = { transaction_date: todayStr(), note:'คืนเงิน (ไม่คืนสินค้า) อ้างอิง '+originalTxId };
  return localAddTransaction(newTx, [refundLineObj], null, {});
}

/* ========================================================================= LINE EDITOR — shared by "บันทึกรายการ" and "แก้ไขรายการ" ========================================================================= */
function createLineEditor(containerId, initialDrafts, opts){
  opts = opts || {};
  let drafts = initialDrafts.slice();

  function needsConfirm(d){ return (Number(d.confidence)||0) < confidenceThreshold() && !d._confirmed; }
  function isResolved(d){
    return !d.needsTypeChoice && !d.needsProductChoice && !d.productNotFound && !d.categoryNotFound && !needsConfirm(d);
  }
  function allResolved(){ return drafts.length>0 && drafts.every(isResolved); }

  function computeSummary(){
    let income=0, expense=0, cogs=0, opex=0;
    drafts.forEach(d=>{
      const total = Number(d.total)||0;
      if(d.type==='income') income+=total;
      else if(d.type==='expense'){
        const isInventoryPurchase = !!d.product_id && !d.is_service_usage && !d.is_return;
        if(isInventoryPurchase){ /* ซื้อสินค้าเข้าสต็อก: ไม่นับเป็นค่าใช้จ่ายดำเนินงาน ป้องกันนับต้นทุนซ้ำ */ }
        else if(d.is_service_usage){ cogs += total; }
        else { opex += total; }
        expense += total;
      }
      if(d.type==='income' && d.cost!==null && d.cost!==undefined && d.cost!=='') cogs += Number(d.cost);
    });
    return {income, expense, cogs, opex, gross: round2(income-cogs), net: round2(income-cogs-opex)};
  }

  function render(){
    const container = document.getElementById(containerId);
    if(!container) return;
    if(!drafts.length){ container.innerHTML = `<div class="empty">ยังไม่มีรายการ</div>`; if(opts.onChange) opts.onChange(drafts, allResolved()); return; }
    const s = computeSummary();
    container.innerHTML = `
      <div class="lines-table-wrap">
        <table>
          <thead><tr>
            <th></th><th>รายการ</th><th>ประเภท</th><th>หมวด</th><th>สินค้า/บริการ</th>
            <th>จำนวน</th><th>ราคา/หน่วย</th><th>ส่วนลด</th><th>รวม</th><th>ต้นทุน</th><th>Stock</th><th>Confidence</th><th></th>
          </tr></thead>
          <tbody>
            ${drafts.map((d,i)=>lineRowHtml(d,i)).join('')}
          </tbody>
        </table>
      </div>
      <div class="summary-bar">
        <div class="item">ยอดรายรับ<b>${fmtMoney(s.income)}</b></div>
        <div class="item">ยอดรายจ่าย<b>${fmtMoney(s.expense)}</b></div>
        <div class="item">ต้นทุนสินค้า/บริการ<b>${fmtMoney(s.cogs)}</b></div>
        <div class="item">กำไรขั้นต้น<b>${fmtMoney(s.gross)}</b></div>
        <div class="item">กำไรสุทธิ (หลังหักค่าใช้จ่ายดำเนินงาน)<b>${fmtMoney(s.net)}</b></div>
      </div>
    `;
    wireRowEvents(container);
    if(opts.onChange) opts.onChange(drafts, allResolved());
  }

  function confidenceBar(d){
    const c = Number(d.confidence)||0;
    const color = c>=confidenceThreshold() ? 'var(--cyan)' : (c>=50?'var(--yellow)':'var(--danger)');
    return `<span class="confidence-label">${c}%</span><span class="confidence-bar"><i style="width:${c}%;background:${color}"></i></span>`;
  }

  /** สเปคข้อ 44: ทุกบรรทัดต้องมีสถานะ ✓ พร้อมบันทึก / ⚠ ต้องตรวจสอบ / ✕ ไม่พบรายการหรือยังไม่ได้จำแนก */
  function statusIcon(d){
    if(d.needsTypeChoice || d.productNotFound || d.categoryNotFound || d.needsProductChoice) return `<span title="ต้องดำเนินการก่อน" class="status-ind bad">${icon('x',14)}</span>`;
    if(needsConfirm(d)) return `<span title="ต้องตรวจสอบ" class="status-ind warn">${icon('alert',14)}</span>`;
    return `<span title="พร้อมบันทึก" class="status-ind ok">${icon('check',14)}</span>`;
  }

  function lineRowHtml(d,i){
    const typeTag = d.type ? `<span class="tag ${d.type}">${d.type==='income'?'รายรับ':'รายจ่าย'}</span>` : `<span class="tag warn">ไม่แน่ใจ</span>`;
    const aiTag = d.source==='AI' ? `<span class="tag ai">AI</span>` : '';
    const mismatchTag = d._totalMismatchNote ? `<span class="tag warn" title="${escapeHtml(d._totalMismatchNote)}">Total ไม่ตรง</span>` : '';
    const stockCell = d.product_id ? (Number(d.quantity)>0 ? (d.type==='income'||d.is_service_usage ? '-'+d.quantity : '+'+d.quantity) : '-') : 'ไม่ตัด';
    let issueRow = '';
    if(d.needsTypeChoice){
      issueRow = `<tr class="line-issue"><td colspan="13"><div class="line-resolve">
        <span class="msg">ระบบไม่แน่ใจว่ารายการนี้เป็นรายรับหรือรายจ่าย — "${escapeHtml(d.raw)}"</span>
        <div class="row"><button class="btn small" data-act="settype" data-i="${i}" data-t="income">เป็นรายรับ</button>
        <button class="btn secondary small" data-act="settype" data-i="${i}" data-t="expense">เป็นรายจ่าย</button>
        ${llmEnabled()?`<button class="btn secondary small" data-act="askai" data-i="${i}">ลองให้ AI ช่วยวิเคราะห์</button>`:''}</div>
      </div></td></tr>`;
    } else if(d.needsProductChoice){
      issueRow = `<tr class="line-issue"><td colspan="13"><div class="line-resolve">
        <span class="msg">พบสินค้าที่เป็นไปได้หลายรายการสำหรับ "${escapeHtml(d.raw)}" — กรุณาเลือก (ระบบจะไม่เดาสุ่ม)</span>
        <div class="candidates">${d.productCandidates.map(p=>`<button class="candidate-btn" data-act="pickproduct" data-i="${i}" data-pid="${p.product_id}"><span class="pn">${escapeHtml(p.product_name)}</span><span class="pm">${p.category} · คงเหลือ ${p.stock||0} ${p.unit}</span></button>`).join('')}</div>
      </div></td></tr>`;
    } else if(d.productNotFound){
      issueRow = `<tr class="line-issue"><td colspan="13"><div class="line-resolve">
        <span class="msg">${icon('alert',13)} พบรายการใหม่ "${escapeHtml(d.searchedName)}" — ยังไม่มีในระบบ กรุณาจำแนกก่อนบันทึก</span>
        <div class="row">
          <button class="btn small" data-act="createproduct" data-i="${i}">+ เพิ่มเข้าคลัง (สินค้า)</button>
          <button class="btn secondary small" data-act="quickservice" data-i="${i}">+ เพิ่มรายการบริการ</button>
          <button class="btn secondary small" data-act="quickexpense" data-i="${i}">+ เพิ่มรายจ่ายใหม่</button>
          <button class="btn secondary small" data-act="skipproduct" data-i="${i}">บันทึกเป็นรายการทั่วไป (ไม่มี Stock)</button>
        </div>
      </div></td></tr>`;
    } else if(d.categoryNotFound){
      issueRow = `<tr class="line-issue"><td colspan="13"><div class="line-resolve">
        <span class="msg">ไม่พบหมวดสำหรับ "${escapeHtml(d.searchedName||d.raw)}"</span>
        <div class="row"><button class="btn small" data-act="createcategory" data-i="${i}">สร้างหมวดใหม่</button></div>
      </div></td></tr>`;
    } else if(needsConfirm(d)){
      issueRow = `<tr class="line-issue"><td colspan="13"><div class="line-resolve">
        <span class="msg">ความมั่นใจของระบบต่ำกว่าเกณฑ์ (${d.confidence}% &lt; ${confidenceThreshold()}%) — โปรดตรวจสอบรายการนี้ก่อนบันทึก</span>
        <div class="row"><button class="btn small" data-act="confirmline" data-i="${i}">ตรวจสอบแล้ว ยืนยันว่าถูกต้อง</button>
        ${llmEnabled()?`<button class="btn secondary small" data-act="askai" data-i="${i}">ลองให้ AI ช่วยวิเคราะห์</button>`:''}</div>
      </div></td></tr>`;
    }
    return `<tr data-row="${i}">
      <td>${statusIcon(d)}</td>
      <td class="line-title-cell">${escapeHtml(d.raw)} ${aiTag} ${mismatchTag}</td>
      <td data-label="ประเภท">${typeTag}</td>
      <td class="hide-mobile" data-label="หมวด">${d.category?escapeHtml(d.category):'<span class="muted">-</span>'}</td>
      <td class="hide-mobile" data-label="สินค้า/บริการ">${escapeHtml(d.product_name||d.description||'-')}</td>
      <td data-label="จำนวน"><input class="mini-input num" type="number" min="0" step="any" data-field="quantity" data-i="${i}" value="${d.quantity}"></td>
      <td data-label="ราคา/หน่วย"><input class="mini-input num" type="number" min="0" step="any" data-field="unit_price" data-i="${i}" value="${d.unit_price!==null?d.unit_price:''}"></td>
      <td data-label="ส่วนลด"><input class="mini-input num" type="number" min="0" step="any" data-field="discount" data-i="${i}" value="${d.discount||0}"></td>
      <td class="num money" data-label="รวม">${fmtMoney(d.total)}</td>
      <td class="num hide-mobile" data-label="ต้นทุน">${d.type==='income' && d.product_id ? (d.cost!==null&&d.cost!==undefined&&d.cost!=='' ? fmtMoney(d.cost) : '<span class="cost-missing">ไม่ทราบ</span>') : (d.cost!=null?fmtMoney(d.cost):'-')}</td>
      <td class="num hide-mobile" data-label="Stock">${stockCell}</td>
      <td class="hide-mobile">${confidenceBar(d)}</td>
      <td><button class="del-line" data-act="delline" data-i="${i}" title="ลบรายการนี้">${icon('x',15)}</button></td>
    </tr>${issueRow}`;
  }

  function recomputeLine(d){
    const qty = Number(d.quantity)||0, up = Number(d.unit_price)||0;
    d.subtotal = round2(qty*up);
    let discount = Number(d.discount)||0;
    if(discount > d.subtotal){ discount = d.subtotal; toast('ส่วนลดมากกว่ายอดรวม ระบบปรับให้เท่ากับยอดสินค้าอัตโนมัติ'); }
    d.discount = discount;
    d.total = round2(d.subtotal - discount);
    if(d.type==='income' && d.product_id){
      const prod = STATE.products.find(p=>p.product_id===d.product_id);
      const unitCost = prod ? (prod.average_cost!==''&&prod.average_cost!=null ? Number(prod.average_cost) : (prod.cost!==''&&prod.cost!=null?Number(prod.cost):null)) : null;
      if(unitCost!==null){ d.cost = round2(unitCost*qty); d.profit = round2(d.total-d.cost); }
    }
    d.confidence = computeConfidence(d);
  }

  function wireRowEvents(container){
    container.querySelectorAll('[data-field]').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        const i = +inp.dataset.i, field = inp.dataset.field;
        drafts[i][field] = parseFloat(inp.value)||0;
        recomputeLine(drafts[i]);
        render();
      });
    });
    container.querySelectorAll('[data-act]').forEach(btn=>{
      btn.addEventListener('click', ()=> handleAction(btn.dataset.act, +btn.dataset.i, btn.dataset));
    });
  }

  async function handleAction(act, i, dataset){
    const d = drafts[i];
    if(act==='settype'){ d.type = dataset.t; d.needsTypeChoice=false; d.inheritedType=false; recomputeLine(d); render(); }
    else if(act==='delline'){ drafts.splice(i,1); render(); }
    else if(act==='confirmline'){ d._confirmed = true; render(); }
    else if(act==='pickproduct'){
      const p = d.productCandidates.find(pp=>pp.product_id===dataset.pid);
      d.product_id=p.product_id; d.product_name=p.product_name; d.needsProductChoice=false;
      d._learnKeyword = { keyword: d.searchedName || d.raw, product_id: p.product_id };
      recomputeLine(d); render();
    }
    else if(act==='skipproduct'){ d.productNotFound=false; d.product_id=null; d.description = d.searchedName; recomputeLine(d); render(); }
    else if(act==='createproduct'){ openCreateProductModal(d, ()=>{ recomputeLine(d); render(); }); }
    else if(act==='createcategory'){ openCreateCategoryModal(d, ()=>render()); }
    else if(act==='quickservice'){ await quickCreateCategoryAndAssign(d, 'income'); recomputeLine(d); render(); }
    else if(act==='quickexpense'){ await quickCreateCategoryAndAssign(d, 'expense'); recomputeLine(d); render(); }
    else if(act==='askai'){
      try{
        toast('กำลังส่งให้ AI ช่วยวิเคราะห์...');
        const suggestions = await apiPost('parsewithai', { text: d.raw });
        if(suggestions && suggestions.length){
          const s = suggestions[0];
          d.type = s.type || d.type; d.category = s.category || d.category;
          if(s.product_id){ d.product_id=s.product_id; d.product_name=s.product_name; d.needsProductChoice=false; }
          else if(s.needsProductChoice){ d.needsProductChoice=true; d.productCandidates=s.productCandidates; }
          if(s.unit_price!=null) d.unit_price = s.unit_price;
          d.quantity = s.quantity||d.quantity; d.source='AI'; d.needsTypeChoice=false;
          d.confidence = 65; d._confirmed=false;
          recomputeLine(d);
        }
        render();
      }catch(err){ toast('เรียก AI ไม่สำเร็จ: '+err.message); }
    }
  }
  function addBlankRow(){
    drafts.push({
      id: uid('d'), raw:'(รายการใหม่ — พิมพ์ชื่อสินค้า/บริการ)', type:null, category:null,
      product_id:null, product_name:'', description:'', quantity:1, unit:'', unit_price:0, discount:0,
      subtotal:0, total:0, cost:null, profit:null, is_service_usage:false, needsTypeChoice:true,
      needsProductChoice:false, productCandidates:[], productNotFound:false, searchedName:'', categoryNotFound:false,
      confidence:20, note:''
    });
    render();
  }

  render();
  return {
    getDrafts: ()=>drafts,
    isAllResolved: allResolved,
    getSummary: computeSummary,
    setDrafts: (nd)=>{ drafts = nd; render(); },
    addBlankRow,
    rerender: render
  };
}

/* ---------- Stock sufficiency check (spec section 18) ---------- */
function checkStockSufficiency(lines, stockOverrides){
  const issues = [];
  lines.forEach(l=>{
    if(l.product_id && (l.type==='income' || l.is_service_usage) && !l.is_return){
      const p = STATE.products.find(pp=>pp.product_id===l.product_id);
      const effectiveStock = (stockOverrides && stockOverrides[l.product_id]!==undefined) ? stockOverrides[l.product_id] : (p?Number(p.stock)||0:0);
      if(p && Number(l.quantity) > effectiveStock) issues.push({line:l, product:p, effectiveStock});
    }
  });
  return issues;
}
function confirmInsufficientStock(issues){
  return new Promise(resolve=>{
    openModal(`
      <div class="modal-head"><h3>Stock ไม่เพียงพอ</h3><button class="close-x" id="mClose">${icon('x')}</button></div>
      <div class="modal-body">

          <div><strong>${escapeHtml(o.product.product_name)}</strong><div class="muted" style="font-size:12px;">คงเหลือ ${o.product.stock||0} ${o.product.unit} — ต้องการขาย ${o.line.quantity}</div></div>
        </div>`).join('')}
        <div class="muted" style="font-size:12px;">ค่าเริ่มต้นของระบบไม่อนุญาตให้ Stock ติดลบ คุณต้องการดำเนินการต่อหรือไม่?</div>
      </div>
      <div class="modal-foot"><button class="btn secondary" id="mCancel">ยกเลิก</button><button class="btn danger" id="mConfirm">ยืนยันการขาย (ยอม Stock ติดลบ)</button></div>
    `);
    document.getElementById('mClose').onclick = ()=>{ closeModal(); resolve(false); };
    document.getElementById('mCancel').onclick = ()=>{ closeModal(); resolve(false); };
    document.getElementById('mConfirm').onclick = ()=>{ closeModal(); resolve(true); };
  });
}

      else if(l.type==='expense' && !(l.product_id && !l.is_service_usage)){ expense+=total; }
    });

function kpiCard(label, value, cls){ const neg = value<0?'neg':''; return `<div class="card kpi ${cls}"><div class="label">${label}</div><div class="value ${neg}">${fmtMoney(value)}</div></div>`; }
function groupSumLines(lines, key){
  const map = {}; lines.forEach(l=>{ const k=l[key]||'อื่นๆ'; map[k]=(map[k]||0)+(Number(l.total)||0); });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,8);
}
function emptyChart(){ return `<div class="empty">ยังไม่มีข้อมูล</div>`; }

function groupedBarChart(labels, series){
  if(!labels.length) return emptyChart();
  const w=560,h=180,pad=26, bw=(w-pad*2)/labels.length;
  const max = Math.max(1, ...series.flatMap(s=>s.values));
  let bars='';
  labels.forEach((lab,i)=>{
    const groupW=bw*0.7, sw=groupW/series.length;
    series.forEach((s,si)=>{
      const val=s.values[i]; const bh=(val/max)*(h-pad*2);
      const x=pad+i*bw+(bw-groupW)/2+si*sw; const y=h-pad-bh;
      bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(sw-2).toFixed(1)}" height="${bh.toFixed(1)}" fill="${s.color}" rx="1"/>`;
    });
  });
  const labelsSvg = labels.map((lab,i)=> i%2===0 ? `<text x="${(pad+i*bw+bw/2).toFixed(1)}" y="${h-8}" font-size="9" fill="var(--muted)" text-anchor="middle" font-family="IBM Plex Mono">${lab}</text>`:'').join('');
  const legend = `<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}">${bars}${labelsSvg}<line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--line)"/></svg>${legend}`;
}
function lineChart(labels, values, color){
  if(!labels.length) return emptyChart();
  const w=560,h=180,pad=26; const max=Math.max(1,...values.map(Math.abs)); const midY=h/2;
  const stepX=(w-pad*2)/(labels.length-1||1);
  const pts = values.map((v,i)=> [pad+i*stepX, midY-(v/max)*(midY-pad)]);
  const path = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const dots = pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.4" fill="${color}"/>`).join('');
  const labelsSvg = labels.map((lab,i)=> i%2===0 ? `<text x="${pts[i][0].toFixed(1)}" y="${h-6}" font-size="9" fill="var(--muted)" text-anchor="middle" font-family="IBM Plex Mono">${lab}</text>`:'').join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}"><line x1="${pad}" y1="${midY}" x2="${w-pad}" y2="${midY}" stroke="var(--line)"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>${dots}${labelsSvg}</svg>`;
}
function hBarChart(entries, color){
  if(!entries.length) return '';
  const w=560, rowH=26, pad=8, labelW=140; const h=entries.length*rowH+pad*2;
  const max=Math.max(...entries.map(e=>e[1]))||1;
  const bars = entries.map(([label,val],i)=>{
    const y=pad+i*rowH; const bw=((w-labelW-40)/max)*val;
    return `<text x="${labelW-8}" y="${y+16}" font-size="11" fill="var(--ink)" text-anchor="end">${escapeHtml(String(label)).slice(0,16)}</text>
      <rect x="${labelW}" y="${y+4}" width="${Math.max(bw,2).toFixed(1)}" height="14" fill="${color}" rx="1"/>
      <text x="${labelW+bw+6}" y="${y+15}" font-size="10.5" fill="var(--muted)" font-family="IBM Plex Mono">${fmtMoney(val)}</text>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}">${bars}</svg>`;
}

async function handleSaveAll(){
  if(!inputLineEditor || !inputLineEditor.isAllResolved()) return;
  const saveBtn = document.getElementById('btnSaveAll');
  const stickyBtn = document.getElementById('btnStickySave');
  if(saveBtn.disabled) return; // กันกดซ้ำระหว่างรอผลลัพธ์
  const drafts = inputLineEditor.getDrafts();
  const issues = checkStockSufficiency(drafts);
  let allowNegativeIds = [];
  if(issues.length){
    const proceed = await confirmInsufficientStock(issues);
    if(!proceed) return;
    allowNegativeIds = issues.map(o=>String(drafts.indexOf(o.line)));
  }
  const lines = drafts.map(d=>({
    type:d.type, category:d.category||'', product_id:d.product_id||'', product_name:d.product_name||'',
    description:d.description||'', quantity:d.quantity, unit:d.unit||'', unit_price:d.unit_price||0,
    discount: d.discount||0, total:d.total||0, cost: d.cost!==null&&d.cost!==undefined?d.cost:'',
    profit: d.profit!==null&&d.profit!==undefined?d.profit:'', is_service_usage: !!d.is_service_usage, note:d.raw
  }));
  const tx = {
    transaction_date: document.getElementById('txDate').value || todayStr(),
    customer_id: (document.getElementById('txCustomer').value||'').trim(),
    customer_name: (document.getElementById('txCustomer').value||'').trim(),
    payment_method: document.getElementById('txPayment').value,
    payment_status: document.getElementById('txPaymentStatus').value,
    amount_paid: document.getElementById('txPaymentStatus').value==='ชำระบางส่วน' ? (parseFloat(document.getElementById('txAmountPaid').value)||0) : '',
    note: STATE.rawInputText
  };
  [saveBtn, stickyBtn].forEach(b=>{ if(b){ b.disabled = true; b.textContent = 'กำลังบันทึก...'; } });
  try{
    let result;
    if(isLive()){
      result = await apiPost('addtransaction', {transaction:tx, lines, client_request_id: currentClientRequestId, allow_negative_ids: allowNegativeIds});
      await loadAll();
    } else {
      result = localAddTransaction(tx, lines, currentClientRequestId, {allowNegativeIds});
    }
    if(result && result.duplicate){ toast('ตรวจพบการบันทึกซ้ำ — ใช้รายการเดิมที่บันทึกไปแล้ว'); }

    for(const d of drafts){
      if(d._learnKeyword){
        const kw = { keyword:d._learnKeyword.keyword, type:d.type, category:d.category, product_id:d._learnKeyword.product_id, priority:5, source:'USER_CORRECTION', active:true };
        if(isLive()){ const saved = await apiPost('upsertkeyword', {keyword:kw}); STATE.keywords.push(saved); }
        else { kw.keyword_id=uid('K'); STATE.keywords.push(kw); }
      }
    }

    const total = lines.reduce((s,l)=> s + (l.type==='income'?(Number(l.total)||0):0), 0);
    document.getElementById('parseInput').value=''; hideLineEditor();
    showSuccessScreen(result.transaction.transaction_id, lines.length, total);
  }catch(err){
    showFriendlyError('บันทึกรายการ', err);
    [saveBtn, stickyBtn].forEach(b=>{ if(b){ b.disabled = false; b.textContent = 'ยืนยันและบันทึก'; } });
  }
}
